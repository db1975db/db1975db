# Küche – Raum-Karte (Panel-Ansicht im Dashboard "Küche", url_path dashboard-kuche)
# Benötigt die Ressource www/raum-card.js (ab v1.2 wegen sockets_title)
type: "custom:raum-card"
name: "Küche"
floor: "Erdgeschoss"
icon: "mdi:silverware-fork-knife"
temperature: "sensor.bthome_sensor_28a8_temperatur"
humidity: "sensor.bthome_sensor_28a8_luftfeuchtigkeit"
climate: "climate.shellywalldisplay_000822de33c9"
lights:
  - entity: "light.aqara_led_deckenspots"
    name: "Deckenspots"
    icon: "mdi:light-recessed"
  - entity: "light.aqara_kuchentisch"
    name: "Küchentisch"
    icon: "mdi:table-chair"
  - entity: "light.aqara_led_decke"
    name: "Kleiner Flur"
    icon: "mdi:ceiling-light"
# Leuchten als Bild (raum-card v1.7.2)
fixtures:
- type: spots
  name: Deckenspots
  entity: light.aqara_led_deckenspots
  bulbs:
  - light.kuche_aqara_led_decke_3
  - light.kuche_aqara_led_decke_4
  - light.kuche_aqara_led_decke_5
  - light.kuche_aqara_led_decke_6
- type: pendants
  name: Küchentisch
  entity: light.aqara_kuchentisch
  bulbs:
  - light.kuche_aqara_kuchentisch_1
  - light.kuche_aqara_kuchentisch_2
  - light.kuche_aqara_kuchentisch_3
  - light.kuche_aqara_kuchentisch_4
- type: spots
  name: Kleiner Flur
  entity: light.aqara_led_decke
  bulbs:
  - light.kuche_aqara_led_decke_1
  - light.kuche_aqara_led_decke_2
# Rollläden als Bild (raum-card v1.10): Fenster mit Blick nach draußen, Ziehen auf dem Fenster setzt die Position
cover_style: scene
covers:
  - entity: "cover.shellyplus2pm_a0a3b3ba2688_kleiner_rollladen"
    name: "Fenster"
  - entity: "cover.shellyplus2pm_e86beae5aaa4_grosser_rollladen"
    name: "Terrassentür"
media:
  - entity: "media_player.sonos_era_100"
    name: "Sonos"
    icon: "mdi:speaker"
    style: player   # "Jetzt läuft" mit Cover und Favoriten (raum-card v1.11)
  # Sony Bravia mit Senderanzeige und Fernbedienung (raum-card v1.14, style: tv + remote)
  - entity: "media_player.bravia_kdl_32w706b"
    name: "Fernseher"
    icon: "mdi:television"
    style: tv
    remote: "remote.bravia_kdl_32w706b"
    sources: true
# SwitchBot-Luftreiniger mit Tisch (raum-card v1.13); Steuerung über Matter (fan.switchbot_air_purifier), Bluetooth-Eintrag fan.luftreiniger_2 reagiert schlecht (RSSI -78); filter_max_h Standard 4380 h
purifier:
  entity: "fan.switchbot_air_purifier"
  air_quality: "sensor.luftreiniger_luftqualitatsstufe"
  pm25: "sensor.luftreiniger_pm25"
  filter: "sensor.kuche_luftreiniger_filterverbrauch"
  filter_reset: "button.kuche_luftreiniger_filterverbrauch_zurucksetzen"
  light: "light.kuche_luftreiniger_leuchte"
  child_lock: "switch.luftreiniger_kindersicherung"
  charging: "switch.luftreiniger_kabelloses_laden"
power:
  - entity: "sensor.kuche_aqara_taster_kuche_leistung"
    name: "Deckenlicht (Aqara Taster)"
  - entity: "sensor.shellyplusplugs_e465b8b601f0_power"
    name: "Kühlschrank"
  - entity: "sensor.shelly1pmmini_543204acd164_power"
    name: "iPad-Ladung"
windows:
  - entity: "binary_sensor.kuche_fensterkontakt_tur"
    name: "Fenster"
batteries:
  - entity: "sensor.bthome_sensor_28a8_batterie"
    name: "Klimasensor"
  - entity: "sensor.kuche_aqara_presence_multisensor_fp300_batterie"
    name: "Präsenzmelder"
  - entity: "sensor.kuche_fensterkontakt_batterie"
    name: "Fensterkontakt"
  - entity: "sensor.kuche_rauchmelder_kuche_batterie"
    name: "Rauchmelder"
  - entity: "sensor.taster_kuche_batterie"
    name: "Hue-Dimmer"
  - entity: "sensor.kuche_taster_kleiner_flur_kuche_batterie"
    name: "Taster kleiner Flur"
