    name: "Stern"
    icon: "mdi:star-four-points"
    power: "sensor.wohnzimmer_stern_leistung"
  - entity: "switch.shellyplusplugs_e465b893b740"
    name: "Laterne"
    icon: "mdi:coach-lamp"
    power: "sensor.shellyplusplugs_e465b893b740_power"
  - entity: "switch.shellyplusplugs_e465b893fb00"
    name: "TV"
    icon: "mdi:television"
    power: "sensor.shellyplusplugs_e465b893fb00_power"
