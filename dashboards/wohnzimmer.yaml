# Wohnzimmer – Raum-Karte (Panel-Ansicht im Dashboard "Wohnzimmer", url_path dashboard-wohnzimmer)
# Benötigt die Ressource www/raum-card.js
type: "custom:raum-card"
name: "Wohnzimmer"
floor: "Erdgeschoss"
icon: "mdi:sofa"
temperature: "sensor.bthome_sensor_86a9_temperatur"
humidity: "sensor.bthome_sensor_86a9_luftfeuchtigkeit"
climate: "climate.shellywalldisplay_000822196d2a"
lights:
  - entity: "light.sofa"
    name: "Sofa"
    icon: "mdi:sofa"
  - entity: "light.tisch_2"
    name: "Esstisch oben"
    icon: "mdi:ceiling-light"
  - entity: "light.tisch"
    name: "Esstisch unten"
    icon: "mdi:floor-lamp"
  - entity: "light.laterne"
    name: "Laterne"
    icon: "mdi:coach-lamp"
    socket: "switch.shellyplusplugs_e465b893b740"
# Leuchten als Bild (raum-card v1.7): Glaskugel-Pendel am Sofa, Hue Ensis am Esstisch
fixtures:
- type: globes
  name: Sofa
  entity: light.sofa
  bulbs:
  - light.hue_color_lamp_1
  - light.hue_color_lamp_2
  - light.hue_color_lamp_3
- type: bar
  name: Esstisch
  entity: light.esstisch_lampen
  up: light.tisch_2
  down: light.tisch
- type: lantern
  name: Laterne
  entity: light.laterne
  socket: switch.shellyplusplugs_e465b893b740
  bulbs:
  - light.wohnzimmer_shellyvintage_1
  - light.wohnzimmer_shellyvintage_2
  - light.wohnzimmer_shellyvintage_3
scene_select: "select.wohnzimmer_wohnzimmer_scenen_szene"
scene_favorites:
  - "Entspannen"
  - "Lesen"
  - "Konzentrieren"
  - "Energie tanken"
  - "Nachtlicht"
  - "Sonnenuntergang"
cover_style: scene
covers:
  - entity: "cover.shellyplus2pm_30c9228035fc_kleiner_rollladen"
    name: "Kleines Fenster"
  - entity: "cover.shellyplus2pm_30c922817678_grosser_rollladen"
    name: "Terrassentür"
media:
  - entity: "media_player.samsung"
    name: "Fernseher"
    icon: "mdi:television"
    sources:
      - "TV"
      - "HDMI"
      - "Netflix"
      - "Prime Video"
      - "Disney+"
      - "YouTube"
      - "ARD Mediathek – Streaming für alle"
      - "ZDF"
      - "Sky Q"
      - "Spotify – Musik und Podcasts"
    play: false
  - entity: "media_player.sky_q"
    name: "Sky Q"
    icon: "mdi:satellite-variant"
    chip: false
    power: false
  - entity: "media_player.wohnzimmer_wohnzimmer"
    name: "HomePod"
    icon: "mdi:speaker"
    power: false
power:
  - entity: "sensor.shellyplusplugs_e465b893fb00_power"
    name: "Fernseher & Co."
  - entity: "sensor.wohnzimmer_aqara_taster_wohnzimmer_leistung"
    name: "Aqara Taster"
  - entity: "sensor.shellyplusplugs_e465b893b740_power"
    name: "Laterne"
  - entity: "sensor.wohnzimmer_stern_leistung"
    name: "Stern"
windows:
  - entity: "binary_sensor.multi_state_sensor_p100_tur_3"
    name: "Terrassentür"
batteries:
  - entity: "sensor.bthome_sensor_86a9_batterie"
    name: "Klimasensor"
  - entity: "sensor.multi_state_sensor_p100_batterie_4"
    name: "Fensterkontakt"
  - entity: "sensor.fensterkontakt_batterie"
    name: "Terrassentür-Sensor"
sockets:
