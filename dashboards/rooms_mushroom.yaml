# ══════════════════════════════════════════════════════
#  12 Räume — mushroom-template-card (HACS Variante B)
#
#  Voraussetzungen (HACS → Frontend):
#    • mushroom          lovelace-mushroom
#    • card-mod          lovelace-card-mod   ← für Hintergrundfarben
#
#  Entity-IDs anpassen: alle Zeilen mit # ANPASSEN
#
#  Kurzreferenz Aktionen:
#    Tippen  → öffnet Raum-Detailseite
#    Halten  → schaltet Hauptlicht um
# ══════════════════════════════════════════════════════

views:
  - type: sections
    path: raeume
    title: Räume
    max_columns: 3
    badges: []
    sections:

      # ╔══════════════════════════════════════════╗
      # ║  ERDGESCHOSS                             ║
      # ╚══════════════════════════════════════════╝
      - type: grid
        title: Erdgeschoss
        cards:

          # ── Eingang ──────────────────────────────
          - type: custom:mushroom-template-card
            primary: Eingang
            secondary: >-
              {% if is_state('light.eingang', 'on') %}
                Licht an
              {% else %}
                Alles aus
              {% endif %}
            icon: mdi:door-open
            icon_color: >-
              {{ 'amber' if is_state('light.eingang', 'on') else 'blue-grey' }}
            badge_icon: >-
              {{ 'mdi:lightbulb' if is_state('light.eingang', 'on') else 'mdi:lightbulb-off-outline' }}
            badge_color: >-
              {{ 'amber' if is_state('light.eingang', 'on') else 'disabled' }}
            fill_container: true
            tap_action:
              action: navigate
              navigation_path: /lovelace/eingang
            hold_action:
              action: toggle
              entity: light.eingang          # ANPASSEN
            card_mod:
              style: >
                :host {
                  --card-background-color:
                    {{ '#3d2e0e' if is_state('light.eingang', 'on') else '#1c2537' }};
                }

          # ── Flur EG ──────────────────────────────
          - type: custom:mushroom-template-card
            primary: Flur EG
            secondary: >-
              {% if is_state('light.flur_eg', 'on') %}
                Licht an
              {% else %}
                Alles aus
              {% endif %}
            icon: mdi:floor-plan
            icon_color: >-
              {{ 'amber' if is_state('light.flur_eg', 'on') else 'blue-grey' }}
            badge_icon: >-
              {{ 'mdi:lightbulb' if is_state('light.flur_eg', 'on') else 'mdi:lightbulb-off-outline' }}
            badge_color: >-
              {{ 'amber' if is_state('light.flur_eg', 'on') else 'disabled' }}
            fill_container: true
            tap_action:
              action: navigate
              navigation_path: /lovelace/flur-eg
            hold_action:
              action: toggle
              entity: light.flur_eg          # ANPASSEN
            card_mod:
              style: >
                :host {
                  --card-background-color:
                    {{ '#2e2810' if is_state('light.flur_eg', 'on') else '#1c2537' }};
                }

          # ── Küche ────────────────────────────────
          - type: custom:mushroom-template-card
            primary: Küche
            secondary: >-
              {% set t = states('sensor.temp_kueche') %}
              {% set l = expand('light.kueche') | selectattr('state','eq','on') | list | count %}
              {{ t | round(1) }}°C
              {%- if l > 0 %} · {{ l }} Licht{{ 'er' if l > 1 else '' }} an{% endif %}
            icon: mdi:countertop
            icon_color: >-
              {{ 'deep-orange' if is_state('light.kueche', 'on') else 'blue-grey' }}
            badge_icon: >-
              {{ 'mdi:lightbulb' if is_state('light.kueche', 'on') else 'mdi:lightbulb-off-outline' }}
            badge_color: >-
              {{ 'amber' if is_state('light.kueche', 'on') else 'disabled' }}
            fill_container: true
            tap_action:
              action: navigate
              navigation_path: /lovelace/kueche
            hold_action:
              action: toggle
              entity: light.kueche           # ANPASSEN
            card_mod:
              style: >
                :host {
                  --card-background-color:
                    {{ '#3d2410' if is_state('light.kueche', 'on') else '#1c2537' }};
                }

          # ── Esszimmer ────────────────────────────
          - type: custom:mushroom-template-card
            primary: Esszimmer
            secondary: >-
              {% set t = states('sensor.temp_esszimmer') %}
              {% set l = expand('light.esszimmer') | selectattr('state','eq','on') | list | count %}
              {{ t | round(1) }}°C
              {%- if l > 0 %} · {{ l }} Licht{{ 'er' if l > 1 else '' }} an{% endif %}
            icon: mdi:table-furniture
            icon_color: >-
              {{ 'amber' if is_state('light.esszimmer', 'on') else 'blue-grey' }}
            badge_icon: >-
              {{ 'mdi:lightbulb' if is_state('light.esszimmer', 'on') else 'mdi:lightbulb-off-outline' }}
            badge_color: >-
              {{ 'amber' if is_state('light.esszimmer', 'on') else 'disabled' }}
            fill_container: true
            tap_action:
              action: navigate
              navigation_path: /lovelace/esszimmer
            hold_action:
              action: toggle
              entity: light.esszimmer        # ANPASSEN
            card_mod:
              style: >
                :host {
                  --card-background-color:
                    {{ '#352212' if is_state('light.esszimmer', 'on') else '#1c2537' }};
                }

          # ── Wohnzimmer ───────────────────────────
          - type: custom:mushroom-template-card
            primary: Wohnzimmer
            secondary: >-
              {% set t = states('sensor.temp_wohnzimmer') %}
              {% set l = expand('light.wohnzimmer') | selectattr('state','eq','on') | list | count %}
              {% set tv = is_state('media_player.wohnzimmer_tv', 'playing') %}
              {{ t | round(1) }}°C
              {%- if l > 0 %} · {{ l }} Licht{{ 'er' if l > 1 else '' }} an{% endif %}
              {%- if tv %} · TV läuft{% endif %}
            icon: mdi:sofa
            icon_color: >-
              {{ 'light-blue' if is_state('light.wohnzimmer', 'on') else 'blue-grey' }}
            badge_icon: >-
              {% if is_state('media_player.wohnzimmer_tv', 'playing') %}
                mdi:television-play
              {% elif is_state('light.wohnzimmer', 'on') %}
                mdi:lightbulb
              {% else %}
                mdi:lightbulb-off-outline
              {% endif %}
            badge_color: >-
              {% if is_state('media_player.wohnzimmer_tv', 'playing') %}
                green
              {% elif is_state('light.wohnzimmer', 'on') %}
                amber
              {% else %}
                disabled
              {% endif %}
            fill_container: true
            tap_action:
              action: navigate
              navigation_path: /lovelace/wohnzimmer
            hold_action:
              action: toggle
              entity: light.wohnzimmer       # ANPASSEN
            card_mod:
              style: >
                :host {
                  --card-background-color:
                    {{ '#122640' if is_state('light.wohnzimmer', 'on') else '#1c2537' }};
                }

          # ── Bad EG ───────────────────────────────
          - type: custom:mushroom-template-card
            primary: Bad EG
            secondary: >-
              {% if is_state('light.bad_eg', 'on') %}
                Licht an
              {% elif is_state('switch.lueftung_bad_eg', 'on') %}
                Lüftung läuft
              {% else %}
                Alles aus
              {% endif %}
            icon: mdi:shower
            icon_color: >-
              {{ 'cyan' if is_state('light.bad_eg', 'on') else 'blue-grey' }}
            badge_icon: >-
              {{ 'mdi:lightbulb' if is_state('light.bad_eg', 'on') else 'mdi:lightbulb-off-outline' }}
            badge_color: >-
              {{ 'cyan' if is_state('light.bad_eg', 'on') else 'disabled' }}
            fill_container: true
            tap_action:
              action: navigate
              navigation_path: /lovelace/bad-eg
            hold_action:
