              entity: light.bad_eg           # ANPASSEN
            card_mod:
              style: >
                :host {
                  --card-background-color:
                    {{ '#0e2633' if is_state('light.bad_eg', 'on') else '#1c2537' }};
                }

      # ╔══════════════════════════════════════════╗
      # ║  OBERGESCHOSS                            ║
      # ╚══════════════════════════════════════════╝
