              {%- if l > 0 %} · {{ l }} Licht{{ 'er' if l > 1 else '' }} an{% endif %}
            icon: mdi:toy-brick
            icon_color: >-
              {{ 'green' if is_state('light.kinderzimmer_1', 'on') else 'blue-grey' }}
            badge_icon: >-
              {{ 'mdi:lightbulb' if is_state('light.kinderzimmer_1', 'on') else 'mdi:lightbulb-off-outline' }}
            badge_color: >-
              {{ 'green' if is_state('light.kinderzimmer_1', 'on') else 'disabled' }}
            fill_container: true
            tap_action:
              action: navigate
              navigation_path: /lovelace/kinderzimmer-1
            hold_action:
              action: toggle
              entity: light.kinderzimmer_1   # ANPASSEN
            card_mod:
              style: >
                :host {
                  --card-background-color:
                    {{ '#163228' if is_state('light.kinderzimmer_1', 'on') else '#1c2537' }};
                }

          # ── Kinderzimmer 2 ───────────────────────
          - type: custom:mushroom-template-card
