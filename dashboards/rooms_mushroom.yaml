              entity: light.flur_og          # ANPASSEN
            card_mod:
              style: >
                :host {
                  --card-background-color:
                    {{ '#2e2810' if is_state('light.flur_og', 'on') else '#1c2537' }};
                }

          # ── Schlafzimmer ─────────────────────────
          - type: custom:mushroom-template-card
            primary: Schlafzimmer
            secondary: >-
              {% set t = states('sensor.temp_schlafzimmer') %}
              {% set l = expand('light.schlafzimmer') | selectattr('state','eq','on') | list | count %}
              {{ t | round(1) }}°C
              {%- if l > 0 %} · {{ l }} Licht{{ 'er' if l > 1 else '' }} an{% endif %}
            icon: mdi:bed
            icon_color: >-
              {{ 'deep-purple' if is_state('light.schlafzimmer', 'on') else 'blue-grey' }}
            badge_icon: >-
              {{ 'mdi:lightbulb' if is_state('light.schlafzimmer', 'on') else 'mdi:lightbulb-off-outline' }}
            badge_color: >-
