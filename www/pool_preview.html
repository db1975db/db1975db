<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pool Dashboard Vorschau</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #061020;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      padding: 12px;
      gap: 10px;
    }
    h1 { color: rgba(255,255,255,0.3); font-size: 10px; letter-spacing: 3px; text-transform: uppercase; }
    .card { width: 100%; max-width: 1600px; border-radius: 16px; overflow: hidden;
            box-shadow: 0 12px 48px rgba(0,0,0,0.8); }
    .card svg { display: block; width: 100%; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .chip { display: flex; align-items: center; gap: 6px;
            background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 999px; padding: 6px 14px; font-size: 13px; color: rgba(255,255,255,0.75); }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot.green  { background:#4caf50; box-shadow:0 0 6px #4caf50; }
    .dot.orange { background:#ff6b35; box-shadow:0 0 6px #ff6b35; }
    .dot.yellow { background:#ffe082; box-shadow:0 0 6px #ffe082; }
    .dot.off    { background:#546e7a; }
    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
                width: 100%; max-width: 1600px; }
    .btn { background: linear-gradient(135deg,#0d1b2a,#1a2f45);
           border: 1px solid rgba(255,255,255,0.08); border-radius:14px;
           padding: 18px 12px; display:flex; flex-direction:column;
           align-items:center; gap:8px; }
    .btn svg { width: 32px; height: 32px; }
    .btn span { font-size: 13px; color: rgba(255,255,255,0.75); }
    .btn.pump  { border-color: rgba(76,175,80,0.35); }
    .btn.heat  { border-color: rgba(255,107,53,0.35); }
    .btn.light { border-color: rgba(255,224,130,0.35); }
    .btn.elek  { border-color: rgba(76,175,80,0.35); }

    @keyframes wave1 { 0%{transform:translateX(0)}    100%{transform:translateX(-250px)} }
    @keyframes wave2 { 0%{transform:translateX(-180px)} 100%{transform:translateX(0)} }
    @keyframes wave3 { 0%{transform:translateX(0)}    100%{transform:translateX(-400px)} }
    @keyframes lightPulse  { 0%,100%{opacity:.6} 50%{opacity:1} }
    @keyframes heaterFlicker { 0%,100%{opacity:1} 50%{opacity:.72} }
    @keyframes bubble { 0%{transform:translateY(0);opacity:.9} 100%{transform:translateY(-10px);opacity:0} }
    @keyframes ripple { 0%{r:6;opacity:.8} 100%{r:22;opacity:0} }
  </style>
</head>
<body>
<h1>Pool Dashboard — Vorschau (alle Geräte EIN)</h1>
<div class="card">
<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- Backgrounds -->
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#1a2535"/>
    <stop offset="100%" stop-color="#0d1822"/>
  </linearGradient>

  <!-- Thermoesche wood — left deck (gleiche Laufrichtung wie unten = horizontal) -->
  <linearGradient id="woodLeftShade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"   stop-color="rgba(0,0,0,0.4)"/>
    <stop offset="55%"  stop-color="rgba(0,0,0,0)"/>
    <stop offset="100%" stop-color="rgba(0,0,0,0.08)"/>
  </linearGradient>

  <!-- Thermoesche wood — bottom deck (horizontal planks) -->
  <pattern id="woodBottom" x="0" y="0" width="1" height="20" patternUnits="userSpaceOnUse">
    <rect x="0" y="0"  width="1" height="17" fill="#7C6A52"/>
    <rect x="0" y="17" width="1" height="3"  fill="#2e1e0f"/>
    <rect x="0" y="4"  width="1" height="1"  fill="#8A7860" opacity="0.5"/>
    <rect x="0" y="11" width="1" height="1"  fill="#6A5840" opacity="0.4"/>
  </pattern>
  <linearGradient id="woodBottomShade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="rgba(0,0,0,0.3)"/>
    <stop offset="50%"  stop-color="rgba(0,0,0,0)"/>
    <stop offset="100%" stop-color="rgba(0,0,0,0.25)"/>
  </linearGradient>

  <!-- Pool coping -->
  <linearGradient id="copingGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#5e6e7e"/>
    <stop offset="100%" stop-color="#3d4d5c"/>
  </linearGradient>

  <!-- Water -->
  <linearGradient id="waterGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#2196f3"/>
    <stop offset="100%" stop-color="#0a3a7a"/>
  </linearGradient>
  <radialGradient id="waterHL" cx="35%" cy="25%">
    <stop offset="0%"   stop-color="rgba(255,255,255,0.15)"/>
    <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
  </radialGradient>

  <!-- Staircase fills (lighter = shallower) -->
  <linearGradient id="step3Grad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#64b5f6" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#42a5f5" stop-opacity="0.4"/>
  </linearGradient>
  <linearGradient id="step2Grad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#2196f3" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#1976d2" stop-opacity="0.35"/>
  </linearGradient>

  <!-- Light glow -->
  <radialGradient id="lightGlow" cx="50%" cy="50%">
    <stop offset="0%"   stop-color="#ffe082" stop-opacity="1"/>
    <stop offset="100%" stop-color="#ffe082" stop-opacity="0"/>
  </radialGradient>

  <!-- Filters -->
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="woodShadow">
    <feDropShadow dx="3" dy="0" stdDeviation="4" flood-color="rgba(0,0,0,0.5)"/>
  </filter>

  <!-- Wave patterns (3 layers, different amplitudes/phases) -->
  <pattern id="waveA" x="0" y="0" width="250" height="60" patternUnits="userSpaceOnUse">
    <path d="M0 30 Q30 12 62 30 Q94 48 125 30 Q156 12 187 30 Q219 48 250 30"
          fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="2"/>
    <path d="M0 45 Q30 27 62 45 Q94 63 125 45 Q156 27 187 45 Q219 63 250 45"
          fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  </pattern>
  <pattern id="waveB" x="0" y="0" width="380" height="80" patternUnits="userSpaceOnUse">
    <path d="M0 40 Q48 10 95 40 Q143 70 190 40 Q238 10 285 40 Q333 70 380 40"
          fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2.5"/>
  </pattern>
  <pattern id="waveC" x="0" y="0" width="160" height="40" patternUnits="userSpaceOnUse">
    <path d="M0 20 Q20 8 40 20 Q60 32 80 20 Q100 8 120 20 Q140 32 160 20"
          fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
  </pattern>

  <clipPath id="waterClip">
    <rect x="242" y="72" width="1278" height="714" rx="14"/>
  </clipPath>
</defs>

<!-- ═══ BACKGROUND ═══ -->
<rect width="1600" height="900" fill="url(#bgGrad)"/>

<!-- ═══ LEFT WOOD DECK (Thermoesche, horizontal wie unten) ═══ -->
<rect x="0" y="0" width="188" height="900" fill="url(#woodBottom)" filter="url(#woodShadow)"/>
<rect x="0" y="0" width="188" height="900" fill="url(#woodLeftShade)"/>
<!-- wood edge highlight -->
<rect x="185" y="0" width="3" height="900" fill="rgba(255,255,255,0.06)"/>

<!-- ═══ BOTTOM WOOD DECK (Thermoesche) ═══ -->
<rect x="0" y="808" width="1600" height="92" fill="url(#woodBottom)"/>
<rect x="0" y="808" width="1600" height="92" fill="url(#woodBottomShade)"/>
<!-- wood edge highlight (top of bottom deck) -->
<rect x="0" y="808" width="1600" height="3" fill="rgba(255,255,255,0.07)"/>

<!-- ═══ POOL COPING (stone border) ═══ -->
<rect x="200" y="28" width="1370" height="770" rx="26" fill="url(#copingGrad)"/>
<rect x="200" y="28" width="1370" height="16" rx="14" fill="rgba(255,255,255,0.08)"/>
<line x1="200" y1="44" x2="1570" y2="44" stroke="rgba(0,0,0,0.12)" stroke-width="1"/>

<!-- ═══ POOL WATER ═══ -->
<rect x="242" y="72" width="1278" height="714" rx="14" fill="url(#waterGrad)"/>

<!-- Water tile border -->
<rect x="242" y="72"  width="1278" height="10" rx="8"  fill="rgba(130,200,255,0.22)"/>
<rect x="242" y="776" width="1278" height="10" rx="8"  fill="rgba(100,180,255,0.12)"/>
<rect x="242" y="72"  width="10"   height="714" rx="5" fill="rgba(100,180,255,0.12)"/>
<rect x="1510" y="72" width="10"   height="714" rx="5" fill="rgba(100,180,255,0.12)"/>

<!-- ═══ ANIMATED WAVES (3 layers) ═══ -->
<g clip-path="url(#waterClip)">
  <!-- Layer A: medium waves, moving right -->
  <rect x="-250" y="72" width="2100" height="714"
        fill="url(#waveA)" style="animation:wave1 3.5s linear infinite"/>
  <!-- Layer B: large slow waves, moving left -->
  <rect x="-380" y="72" width="2360" height="714"
        fill="url(#waveB)" style="animation:wave2 6s linear infinite"/>
  <!-- Layer C: fine fast waves, moving right faster -->
  <rect x="-160" y="72" width="1960" height="714"
        fill="url(#waveC)" style="animation:wave3 2s linear infinite"/>
</g>

<!-- Water highlight (sun reflection) -->
<ellipse cx="780" cy="300" rx="380" ry="120" fill="url(#waterHL)"/>

<!-- ═══ POOL STAIRCASE — bottom-left (3 runde Stufen, Vogelperspektive) ═══ -->
<!-- Ecke des Pools: x=242, y=786. Stufen als Viertelkreise. -->
<!-- Stufe 3 (seichteste, äußerste): r=205 -->
<path d="M 242,786 L 242,581 A 205,205 0 0 1 447,786 Z"
      fill="rgba(100,181,246,0.48)" stroke="rgba(255,255,255,0.28)" stroke-width="2"/>
<!-- Stufe 2 (mittel): r=138 -->
<path d="M 242,786 L 242,648 A 138,138 0 0 1 380,786 Z"
      fill="rgba(33,150,243,0.42)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
<!-- Stufe 1 (tiefste): r=75 -->
<path d="M 242,786 L 242,711 A 75,75 0 0 1 317,786 Z"
      fill="rgba(13,71,161,0.45)" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>
<!-- Stufenkanten als Bögen -->
<path d="M 242,581 A 205,205 0 0 1 447,786" fill="none"
      stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
<path d="M 242,648 A 138,138 0 0 1 380,786" fill="none"
      stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
<path d="M 242,711 A 75,75 0 0 1 317,786" fill="none"
      stroke="rgba(255,255,255,0.16)" stroke-width="1.5"/>
<text x="360" y="762" text-anchor="middle"
      font-family="Arial" font-size="11" fill="rgba(255,255,255,0.3)" letter-spacing="1">TREPPE</text>

<!-- ═══ TEMPERATURE ═══ -->
<text x="880" y="430" text-anchor="middle"
      font-family="'Helvetica Neue',Arial,sans-serif"
      font-size="110" font-weight="700"
      fill="rgba(255,255,255,0.95)" filter="url(#textGlow)">26.3°</text>
<text x="880" y="468" text-anchor="middle"
      font-family="'Helvetica Neue',Arial,sans-serif"
      font-size="13" fill="rgba(255,255,255,0.4)" letter-spacing="5">WASSERTEMPERATUR</text>

<!-- ═══ LIGHTS — 2 Fixtures entlang Oberkante ═══ -->
<!-- Glow halos -->
<circle cx="540"  cy="82" r="46" fill="url(#lightGlow)" opacity="0.32" style="animation:lightPulse 2s ease-in-out infinite 0s"/>
<circle cx="1220" cy="82" r="46" fill="url(#lightGlow)" opacity="0.32" style="animation:lightPulse 2s ease-in-out infinite 0.6s"/>
<!-- Fixtures -->
<circle cx="540"  cy="82" r="16" fill="#ffe082" filter="url(#glow)" style="animation:lightPulse 2s ease-in-out infinite 0s"/>
<circle cx="1220" cy="82" r="16" fill="#ffe082" filter="url(#glow)" style="animation:lightPulse 2s ease-in-out infinite 0.6s"/>
<!-- Center dots -->
<circle cx="540"  cy="82" r="5" fill="white" opacity="0.9"/>
<circle cx="1220" cy="82" r="5" fill="white" opacity="0.9"/>
<text x="880" y="50" text-anchor="middle"
      font-family="Arial" font-size="11" fill="#ffe082" letter-spacing="2">● POOLBELEUCHTUNG ●</text>

<!-- ═══ SKIMMER — left wall ═══ -->
<rect x="225" y="370" width="28" height="62" rx="5"
      fill="#2a3d50" stroke="#546e7a" stroke-width="1.5"/>
<rect x="228" y="373" width="22" height="56" rx="3" fill="rgba(255,255,255,0.04)"/>
<text x="192" y="404" text-anchor="middle"
      font-family="Arial" font-size="11" fill="#78909c" letter-spacing="1">SKIMMER</text>

<!-- ═══ INLET NOZZLES — right wall (2x) ═══ -->
<circle cx="1520" cy="320" r="9" fill="#3d5060" stroke="#607d8b" stroke-width="2"/>
<circle cx="1520" cy="320" r="4" fill="#546e7a"/>
<!-- ripple when pump on -->
<circle cx="1520" cy="320" r="9" fill="none" stroke="rgba(100,180,255,0.5)" stroke-width="1.5"
        style="animation:ripple 2s ease-out infinite"/>
<circle cx="1520" cy="480" r="9" fill="#3d5060" stroke="#607d8b" stroke-width="2"/>
<circle cx="1520" cy="480" r="4" fill="#546e7a"/>
<circle cx="1520" cy="480" r="9" fill="none" stroke="rgba(100,180,255,0.5)" stroke-width="1.5"
        style="animation:ripple 2s ease-out infinite 0.8s"/>
<text x="1555" y="405" text-anchor="middle"
      font-family="Arial" font-size="10" fill="#546e7a"
      transform="rotate(90 1555 405)" letter-spacing="1">EINLAUF</text>

<!-- ═══ PUMP — left deck ═══ -->
<circle cx="94" cy="200" r="22" fill="#4caf50" filter="url(#softGlow)" opacity="0.9"/>
<circle cx="94" cy="200" r="10" fill="white" opacity="0.85"/>
<circle cx="94" cy="200" r="4"  fill="#4caf50"/>
<text x="94" y="232" text-anchor="middle"
      font-family="Arial" font-size="11" fill="#90a4ae" letter-spacing="1">PUMPE</text>
<text x="94" y="246" text-anchor="middle"
      font-family="Arial" font-size="10" fill="#4caf50">EIN</text>

<!-- ═══ WÄRMEPUMPE — top right (outside pool) ═══ -->
<circle cx="1540" cy="52" r="22" fill="#ff6b35" filter="url(#softGlow)"
        style="animation:heaterFlicker 3s ease-in-out infinite"/>
<text x="1540" y="58" text-anchor="middle" font-family="Arial" font-size="20" fill="white">♨</text>
<text x="1540" y="32" text-anchor="middle"
      font-family="Arial" font-size="10" fill="#ff8c60" letter-spacing="1">WÄRMEP.</text>
<text x="1540" y="82" text-anchor="middle"
      font-family="Arial" font-size="10" fill="#ff6b35">EIN</text>

<!-- ═══ ELEKTROLYSE — left deck (with pH + Redox) ═══ -->
<!-- Box -->
<rect x="18" y="530" width="152" height="110" rx="10"
      fill="#1a3a20" stroke="#4caf50" stroke-width="1.5"/>
<!-- Title -->
<text x="94" y="550" text-anchor="middle"
      font-family="Arial" font-size="10" fill="#4caf50" letter-spacing="1">ELEKTROLYSE</text>
<!-- Cl2 label -->
<text x="94" y="568" text-anchor="middle"
      font-family="Arial" font-size="13" font-weight="bold" fill="#a5d6a7">Cl₂</text>
<!-- pH value -->
<text x="50" y="592" text-anchor="middle"
      font-family="Arial" font-size="9" fill="rgba(255,255,255,0.5)" letter-spacing="1">pH</text>
<text x="50" y="610" text-anchor="middle"
      font-family="'Helvetica Neue',Arial" font-size="18" font-weight="700" fill="#80cbc4">7.2</text>
<!-- Redox value -->
<text x="138" y="592" text-anchor="middle"
      font-family="Arial" font-size="9" fill="rgba(255,255,255,0.5)" letter-spacing="1">REDOX</text>
<text x="138" y="610" text-anchor="middle"
      font-family="'Helvetica Neue',Arial" font-size="18" font-weight="700" fill="#80deea">745</text>
<!-- divider -->
<line x1="94" y1="582" x2="94" y2="620" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
<!-- Bubbles -->
<circle cx="75" cy="628" r="3" fill="#a5d6a7" opacity="0.8"
        style="animation:lightPulse 1.1s ease-in-out infinite"/>
<circle cx="90" cy="622" r="2" fill="#a5d6a7" opacity="0.6"
        style="animation:lightPulse 0.9s ease-in-out infinite 0.3s"/>
<circle cx="107" cy="626" r="2.5" fill="#a5d6a7" opacity="0.7"
        style="animation:lightPulse 1.3s ease-in-out infinite 0.6s"/>
<!-- EIN label -->
<text x="94" y="638" text-anchor="middle"
      font-family="Arial" font-size="9" fill="#4caf50">● EIN</text>

<!-- Status bar (bottom of pool, over wood) -->
<rect x="200" y="814" width="1370" height="32" rx="8" fill="rgba(0,0,0,0.35)"/>
<text x="885" y="834" text-anchor="middle"
      font-family="Arial" font-size="11" fill="rgba(255,255,255,0.4)" letter-spacing="0.5">
  Pumpe ● EIN   Wärmepumpe ● EIN   Licht ● EIN   Elektrolyse ● EIN   pH 7.2   Redox 745
</text>
</svg>
</div>

<!-- Chips -->
<div class="chips">
  <div class="chip">🌡 26.3°C</div>
  <div class="chip"><span class="dot green"></span> Pumpe</div>
  <div class="chip"><span class="dot orange"></span> Wärmepumpe</div>
  <div class="chip"><span class="dot yellow"></span> Licht</div>
  <div class="chip"><span class="dot green"></span> Elektrolyse · pH 7.2 · Redox 745</div>
</div>

<!-- Controls -->
<div class="controls">
  <div class="btn pump">
    <svg viewBox="0 0 24 24" fill="none" stroke="#4caf50" stroke-width="1.8">
      <ellipse cx="12" cy="12" rx="4" ry="4"/>
      <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
    </svg>
    <span>Pumpe</span>
  </div>
  <div class="btn heat">
    <svg viewBox="0 0 24 24" fill="none" stroke="#ff6b35" stroke-width="1.8">
      <path d="M12 2a5 5 0 0 1 5 5c0 3-5 7-5 7S7 10 7 7a5 5 0 0 1 5-5z"/>
      <path d="M12 21v-7"/>
    </svg>
    <span>Wärmepumpe</span>
  </div>
  <div class="btn light">
    <svg viewBox="0 0 24 24" fill="none" stroke="#ffe082" stroke-width="1.8">
      <circle cx="12" cy="12" r="5"/>
      <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
    </svg>
    <span>Licht</span>
  </div>
  <div class="btn elek">
    <svg viewBox="0 0 24 24" fill="none" stroke="#4caf50" stroke-width="1.8">
      <path d="M12 2v4M12 18v4M5 5l2 2M17 17l2 2M2 12h4M18 12h4M5 19l2-2M17 7l2-2"/>
      <circle cx="12" cy="12" r="3"/>
    </svg>
    <span>Elektrolyse</span>
  </div>
</div>
</body>
</html>
