   ========================================================= */
// Leistungen einer Fläche: Vorarbeiten, Tapete, Anstrich – jeweils mit der Flächenmenge
function flaechenLeistungen(titel, f, menge){
  if (!f) return [];
  const out = [];
  for (const v of f.vor||[]) out.push([`${titel}: ${v}`, menge, 'm²', titel, v, 0, {typ:'vor', gruppe:titel, v}]);
  if (f.belag) out.push([`${titel} tapezieren: ${f.belag}`, menge, 'm²', titel, `Tapezieren: ${f.belag}`, 1, {typ:'tapezieren', gruppe:titel, belag:f.belag}]);
  if (f.anstrich) out.push([`${titel} streichen ${f.anzahl||2}×: ${f.anstrich}${f.farbton?`, Farbton ${f.farbton}`:''}`, menge, 'm²', titel,
    `Streichen ${f.anzahl||2}× ${f.anstrich.replace('Brillux ','')}${f.farbton?` · ${f.farbton}`:''}`, 2,
    {typ:'streichen', gruppe:titel, n:+(f.anzahl||2), produkt:f.anstrich}]);
  return out;
}
// Mengen für sonstige Arbeiten
function mengeFuer(arbeit, r){
  const treffer = re => migrateRoom(r).pos.filter(x=>re.test(x.label||''));
  const pos = (re, art) => { const t = treffer(re).filter(x=>!art || x.art===art);
    return t.length ? [t.reduce((s,x)=>s+posMenge(x),0), POS_UNITS[t[0].art]] : null; };
  const tueren = (r.abzuege||[]).filter(a=>/tür/i.test(a.art)).reduce((s,a)=>s+(num(a.n)??1),0);
  const fenster = (r.abzuege||[]).filter(a=>/Fenster/.test(a.art)).reduce((s,a)=>s+(num(a.n)??1),0);
  const c = calc(r);
  switch (arbeit){
    case 'Abdecken / Abkleben': return r.typ==='fassade' ? [null,'psch'] : [c.boden, 'm²'];
    case 'Türen lackieren': {
      const tp = treffer(/tür/i).filter(x=>x.art==='stk');
      const seiten = tp.length ? tp.reduce((s,x)=>s + (num(x.n)||0) * (+x.seiten===1 ? 1 : 2), 0) : tueren*2;
      return [seiten||null, 'Seite']; }
    case 'Zargen lackieren': return pos(/zarge/i,'stk') || pos(/tür/i,'stk') || [tueren||null, 'Stk'];
    case 'Fenster lackieren': return pos(/fenster(?!bank)/i,'stk') || [fenster||null, 'Stk'];
    case 'Heizkörper lackieren': return pos(/heizk/i,'stk') || pos(/heizk/i) || [null,'Stk'];
    case 'Sockelleisten': return pos(/sockel/i) || [null,'lfm'];
    case 'Fensterbänke streichen': return pos(/fensterbank/i) || [null,'lfm'];
    case 'Dachuntersicht streichen': return pos(/dachunter/i) || [null,'m²'];
    case 'Ortgang/Dachkasten streichen': return pos(/ortgang|dachkasten/i) || [null,'lfm'];
    case 'Fensterläden lackieren': return pos(/läden|laden/i) || [null,'Stk'];
    case 'Fallrohre lackieren': return pos(/fallrohr|rohr/i) || [null,'lfm'];
    case 'Gerüst': return pos(/gerüst/i) || [null,'m²'];
    case 'Untersichten streichen': return pos(/untersicht/i) || [null,'m²'];
    case 'Geländer lackieren': return pos(/geländer/i) || [null,'lfm'];
    case 'Handlauf lackieren': return pos(/handlauf/i) || [null,'lfm'];
    case 'Wangen streichen': return pos(/wange/i) || [null,'lfm'];
    default: return [null, 'psch'];
  }
}
// Ausführlicher Text im Angebot (die Auswahl im Raum bleibt kurz)
const LEISTUNGS_TEXT = {
  'Türen lackieren': 'Türblätter schleifen, grundieren, 2× lackieren (je Seite)',
};
async function leistungen(id){
  const rooms=sortiert(await byIdx('rooms','projectId',id));
  const map = new Map();
  const add = (arbeit, menge, einheit, name, gruppe='Sonstiges', kurz=arbeit, art=3, meta=null) => {
    const key = arbeit+'|'+einheit;
    const e = map.get(key) || {arbeit, einheit, menge:0, raeume:[], gruppe, kurz, art, meta};
    if (menge) e.menge += menge;
    e.raeume.push({name, menge});
    map.set(key, e);
  };
  for (const r of rooms){
    const c = calc(r), name = r.name || (r.typ==='fassade'?'Fassade':'Raum');
    for (const [k,t] of flaechenVon(r))
      for (const [a,m,u,g,kz,art,meta] of flaechenLeistungen(t, r.flaechen[k], c.fl[k])) add(a, m, u, name, g, kz, art, meta);
    for (const a of r.arbeiten||[]){ const [m,u] = mengeFuer(a, r); add(a, m, u, name, 'Sonstiges', LEISTUNGS_TEXT[a] || a); }
  }
  const G = ['Decke','Wände','Fassade','Sockel','Sonstiges'];
  const liste = [...map.values()].map((e,i)=>({...e, i})).sort((a,b)=>(G.indexOf(a.gruppe)-G.indexOf(b.gruppe)) || (a.art-b.art) || (a.i-b.i));
  return {rooms, liste};
}

function ladeKalk(){
  let eigene = {};
  try{ eigene = JSON.parse(localStorage.getItem('kalk') || '{}'); }catch{}
  const K = JSON.parse(JSON.stringify(KALK_STANDARD));
  for (const k of ['stundensatz','wg','aufschlag','mwst','anfahrt']) if (eigene[k] !== undefined) K[k] = eigene[k];
  for (const [n,v] of Object.entries(eigene.produkte||{})) K.produkte[n] = {...(K.produkte[n]||{einheit:'l',verbrauch:0}), ...v};
  for (const [n,v] of Object.entries(eigene.leistungen||{})) K.leistungen[n] = {...(K.leistungen[n]||{}), ...v};
  return K;
}
// Nur Abweichungen vom Standard speichern
function speichereKalk(K){
  const diff = {produkte:{}, leistungen:{}};
  for (const k of ['stundensatz','wg','aufschlag','mwst','anfahrt'])
    if (JSON.stringify(K[k]) !== JSON.stringify(KALK_STANDARD[k])) diff[k] = K[k];
  for (const [n,v] of Object.entries(K.produkte)){
    const st = KALK_STANDARD.produkte[n] || {}; const d = {};
    for (const f of ['einheit','verbrauch','preis','s']) if (v[f] !== st[f]) d[f] = v[f];
    if (Object.keys(d).length) diff.produkte[n] = d;
  }
  for (const [n,v] of Object.entries(K.leistungen)){
    const st = KALK_STANDARD.leistungen[n] || {}; const d = {};
    for (const f of ['h','s','einheit','mat']) if (JSON.stringify(v[f]) !== JSON.stringify(st[f])) d[f] = v[f];
    if (Object.keys(d).length) diff.leistungen[n] = d;
  }
  try{ localStorage.setItem('kalk', JSON.stringify(diff)); }catch{}
}
// Kalkulationsschlüssel einer Leistung
function kalkSchluessel(e){
  const m = e.meta || {};
  if (m.typ==='streichen') return `${m.gruppe} streichen ${m.n}×`;
  if (m.typ==='tapezieren') return `Tapezieren ${m.belag}`;
  if (m.typ==='vor') return (m.gruppe==='Fassade'||m.gruppe==='Sockel' ? 'außen: ' : '') + m.v;
  return e.arbeit;
}
// Einheitspreis berechnen
function kalkuliere(e, K){
  const key = kalkSchluessel(e), m = e.meta || {};
  let L = K.leistungen[key];
  // 3× Anstrich: aus 1× und 2× hochrechnen
  if (!L && m.typ==='streichen' && m.n===3){
    const a = K.leistungen[`${m.gruppe} streichen 1×`], b = K.leistungen[`${m.gruppe} streichen 2×`];
    if (a && b && a.h!=null && b.h!=null) L = {h: b.h + (b.h - a.h), s:true};
  }
  if (!L || L.h==null) return {key, ep:null, grund:'nach Aufwand'};
  if (!K.stundensatz) return {key, ep:null, grund:'Stundensatz fehlt'};
  let mat = 0; const fehlt = [];
  const add = (name, faktor) => { const P = K.produkte[name];
    if (!P || P.preis==null){ fehlt.push(name); return; } mat += P.preis * P.verbrauch * faktor; };
  for (const [name, f] of L.mat||[]) add(name, f);
  if (m.typ==='streichen' && m.produkt) add(m.produkt, m.n);
  const lohn = L.h * K.stundensatz;
  const selbst = lohn + mat * (1 + K.aufschlag/100);
  const ep = Math.round(selbst * (1 + K.wg/100) * 100) / 100;
  return {key, ep, h:L.h, lohn, mat, fehlt, schaetz: !!L.s || fehlt.some(n=>K.produkte[n]?.s)};
}
const anfahrtPauschale = (km, K) => { if (km==null || km==='' || isNaN(km)) return null;
  for (const [bis, euro] of K.anfahrt) if (bis==null || km <= bis) return euro; return null; };

async function viewOffer(id){
  const p = await get('projects', id); if(!p){ location.hash='#/'; return; }
  setHeader('Angebot', {back:true});
  const {rooms, liste} = await leistungen(id);
  const K = ladeKalk();
  p.angebotHinweis ||= ''; p.preise ||= {};
  const posKey = e => e.arbeit+'|'+e.einheit;

  // Positionen mit EP (eigener Preis hat Vorrang vor Kalkulation)
  const positionen = () => liste.map(e=>{
    const k = kalkuliere(e, K), eigen = p.preise[posKey(e)];
    const ep = eigen!=null ? eigen : k.ep;
    const menge = e.menge || (e.einheit==='psch' ? 1 : 0);
    const gp = ep!=null ? Math.round(ep * (e.einheit==='psch' ? 1 : menge) * 100)/100 : null;
    return {e, k, ep, eigen, gp};
  });
  const summen = pos => {
    const anf = anfahrtPauschale(num(p.km), K);
    const netto = pos.reduce((s,x)=>s+(x.gp||0),0) + (anf||0);
    const mwst = p.p13b ? 0 : Math.round(netto * K.mwst) / 100;
    return {anf, netto, mwst, brutto: netto + mwst, offen: pos.filter(x=>x.gp==null).length};
  };

  const zeile = (x, i) => {
    const {e, k} = x, einh = e.einheit==='psch' ? 'psch' : e.einheit;
    const info = x.eigen!=null ? '✎ eigener Preis'
      : k.ep!=null ? `kalkuliert${k.schaetz?' ⚠️ Schätzwert':''}${k.fehlt?.length?` · ohne Preis: ${k.fehlt.join(', ')}`:''}`
      : (k.grund==='Stundensatz fehlt' ? '⚠️ Stundensatz fehlt (⚙︎ → Kalkulation)' : 'nach Aufwand – Preis eintragen');
    return `<div class="pos">
      <div class="pkopf"><span class="muted">${i+1}</span><b>${esc(e.gruppe==="Sonstiges" ? e.kurz : e.arbeit)}</b></div>
      <div class="pzeile">
        <span class="pmenge">${e.einheit==='psch' ? '1 psch' : fmtE(e.menge, e.einheit)}</span>
        <label class="pep">× <input data-ep="${i}" inputmode="decimal" value="${x.eigen!=null?fmt(x.eigen):''}" placeholder="${k.ep!=null?fmt(k.ep):'EP'}"> €/${einh}</label>
        <b class="pgp" id="gp-${i}">${x.gp!=null?fmt(x.gp)+' €':'–'}</b>
      </div>
      <div class="muted pinfo" id="info-${i}">${info}${x.eigen!=null?` <a href="#" data-reset="${i}">zurück auf Kalkulation</a>`:''}</div>
    </div>`;
  };

  function render(){
    const pos = positionen(), s = summen(pos);
    app.innerHTML = `
      ${!K.stundensatz ? `<div class="hint">⚠️ Noch keine Kalkulationsdaten. <a href="#/kalkulation">⚙︎ Kalkulation einrichten</a></div>` : ''}
      <div class="card">
        <h2>Positionen</h2>
        ${liste.length ? pos.map(zeile).join('') : `<p class="muted" style="margin:0">Noch keine Arbeiten ausgewählt.</p>`}
        <div class="pos">
          <div class="pkopf"><span class="muted">${liste.length+1}</span><b>Anfahrtspauschale</b></div>
          <div class="pzeile"><label class="pep" style="flex:1">Entfernung <input id="km" inputmode="numeric" value="${esc(p.km||'')}" placeholder="km" style="width:70px"> km</label>
            <b class="pgp" id="anf">${s.anf!=null?fmt(s.anf)+' €':'–'}</b></div>
        </div>
      </div>
      <div class="card">
        <div class="sumrow"><span>Netto</span><b id="s-netto">${fmt(s.netto)} €</b></div>
        <div class="sumrow"><span>${p.p13b?'§13b UStG (Steuerschuld Kunde)':`+ ${fmt(K.mwst,0)} % MwSt`}</span><b id="s-mwst">${p.p13b?'–':fmt(s.mwst)+' €'}</b></div>
        <div class="sumrow big"><span>Brutto</span><b id="s-brutto">${fmt(s.brutto)} €</b></div>
        <p class="muted" id="s-offen" style="font-size:13px;margin:6px 0 0" ${s.offen?'':'hidden'}>⚠️ ${s.offen} Position(en) ohne Preis sind nicht in der Summe.</p>
        <label style="display:flex;gap:10px;align-items:center;margin-top:10px;font-size:15px"><input type="checkbox" id="p13b" ${p.p13b?'checked':''} style="width:22px;height:22px">
          Bauleistung an Unternehmer (§13b, ohne MwSt)</label>
      </div>
      <div class="card">
        <h2>Hinweise fürs Angebot</h2>
        <textarea id="hinweis" placeholder="z. B. Ausführung KW 12, Möbel räumt Kunde selbst">${esc(p.angebotHinweis)}</textarea>
      </div>
      <button class="btn block" id="send" style="margin-bottom:10px">An Claude senden (Angebot als PDF)</button>
      <button class="btn sec block" id="copy">Text kopieren</button>
      <p class="muted" style="font-size:13px">EP leer lassen = kalkulierter Preis (grau). Eigenen Preis eintippen, um ihn zu überschreiben. <a href="#/kalkulation">Kalkulation anpassen</a></p>`;
    bind();
  }
  const speichern = debounce(()=>put('projects', p), 300);
  offenesSpeichern = speichern;
  function aktualisieren(){
    const pos = positionen(), s = summen(pos);
    pos.forEach((x,i)=>{ const g=$('#gp-'+i); if (g) g.textContent = x.gp!=null ? fmt(x.gp)+' €' : '–';
      const inf=$('#info-'+i); if (inf && x.eigen!=null) inf.textContent = '✎ eigener Preis'; });
    $('#anf').textContent = s.anf!=null ? fmt(s.anf)+' €' : '–';
    $('#s-netto').textContent = fmt(s.netto)+' €';
    $('#s-mwst').textContent = p.p13b ? '–' : fmt(s.mwst)+' €';
    $('#s-brutto').textContent = fmt(s.brutto)+' €';
    const o=$('#s-offen'); o.hidden = !s.offen; o.textContent = `⚠️ ${s.offen} Position(en) ohne Preis sind nicht in der Summe.`;
  }
  function bind(){
    $$('[data-ep]').forEach(inp=>inp.oninput=()=>{
      const e = liste[+inp.dataset.ep], v = num(inp.value);
      if (v==null) delete p.preise[posKey(e)]; else p.preise[posKey(e)] = v;
      speichern(); aktualisieren();
    });
    $$('[data-reset]').forEach(a=>a.onclick=ev=>{ ev.preventDefault(); delete p.preise[posKey(liste[+a.dataset.reset])]; speichern(); render(); });
    $('#km').oninput = e => { p.km = e.target.value; speichern(); aktualisieren(); };
    $('#p13b').onchange = e => { p.p13b = e.target.checked; speichern(); render(); };
    $('#hinweis').oninput = e => { p.angebotHinweis = e.target.value; speichern(); };
    const text = async () => { await put('projects', p); return angebotText(p, rooms, positionen(), summen(positionen()), K) + '\n\n' + await projectText(id); };
    $('#send').onclick = async ()=> shareText(await text());
    $('#copy').onclick = async ()=>{ const t=await text();
      try{ await navigator.clipboard.writeText(t); toast('Kopiert – jetzt in Claude einfügen'); }catch{ prompt('Text kopieren:', t); } };
  }
  render();
}
function angebotText(p, rooms, pos, s, K){
  let t = `Bitte erstelle ein Angebot für meinen Malerbetrieb (Skill malermeister-angebot).\n`;
  t += `Die Einheitspreise sind bereits fertig kalkuliert (inkl. Material und W+G) – bitte genau so übernehmen.\n\n`;
  t += `KUNDE: ${p.kunde||''}\n${p.adresse?`ADRESSE: ${p.adresse}\n`:''}${p.telefon?`TELEFON: ${p.telefon}\n`:''}AUFMASS VOM: ${fmtDate(p.datum)}\n`;
  t += `MATERIAL: ausschließlich Brillux.\n\n`;
  t += `POSITIONEN (Mengen aus dem Aufmaß, Flächen nach VOB):\n`;
  pos.forEach((x,i)=>{
    const e = x.e, einh = e.einheit==='psch' ? 'psch' : e.einheit;
    t += `${i+1}. ${e.gruppe==='Sonstiges' ? e.kurz : e.arbeit}: ${e.einheit==='psch' ? '1 psch' : fmtE(e.menge, e.einheit)}`;
    t += x.ep!=null ? ` × ${fmt(x.ep)} €/${einh} = ${fmt(x.gp)} €` : ` – Preis nach Aufwand (bitte nachfragen)`;
    t += ` (${e.raeume.map(r=>r.name).join(', ')})\n`;
  });
  if (s.anf!=null) t += `${pos.length+1}. Anfahrtspauschale (${p.km} km): ${fmt(s.anf)} € psch\n`;
  t += `\nNETTO: ${fmt(s.netto)} €\n`;
  t += p.p13b ? `Steuerschuldnerschaft des Leistungsempfängers gem. §13b UStG\n` : `MwSt ${fmt(K.mwst,0)} %: ${fmt(s.mwst)} €\nBRUTTO: ${fmt(s.brutto)} €\n`;
  if (s.offen) t += `(${s.offen} Position(en) ohne Preis sind nicht enthalten)\n`;
  if (p.angebotHinweis) t += `\nHINWEISE: ${p.angebotHinweis}\n`;
  t += `\n--- Aufmaß im Detail ---`;
  return t;
}

async function projectText(id){
  const p=await get('projects',id);
  const rooms=sortiert(await byIdx('rooms','projectId',id));
  let t=`AUFMASS ${p.kunde||''}\n${p.adresse||''}\nDatum: ${fmtDate(p.datum)}\n${p.notiz?p.notiz+'\n':''}\n`;
  let sW=0,sD=0,sF=0,sS=0;
  for (const r of rooms){
    const c=calc(r);
    if (r.typ==='fassade'){
      sF+=c.fassade||0; sS+=c.sockel||0;
      t+=`— Fassade: ${r.name||'Seite'} —\n`;
      t+=`B ${r.b} × H ${r.h} m = ${fmt(c.rechteck)} m²`;
      if (c.giebel) t+=` + Giebel ${fmt(c.giebel)} m² (B ${r.gb||r.b} × H ${r.gh} m ÷ 2)`;
      t+='\n';
      if (c.sockel) t+=`Sockel: Höhe ${r.sockelH} m = ${fmt(c.sockel)} m²\n`;
    } else {
      sW+=c.wand||0; sD+=c.decke||0;
      t+=`— ${r.name||'Raum'} —\n`;
      if (r.form==='walls') t+=`Wände: ${(r.walls||[]).map(w=>w.len).join(' + ')} m, Höhe ${r.h} m\n`;
      else if (r.form==='dach') t+=`Dachschräge (${c.n} Schräge${c.n>1?'n':''}): L ${r.l} × B ${r.b} m, Raumhöhe ${r.h} m, Kniestock ${r.kn} m, Schräge ${r.sl} m\nKniestockwände ${fmt(c.kniestock)} m², Giebelwände ${fmt(c.giebelwaende)} m², Schrägen ${fmt(c.schraege)} m² (zu ${r.schrZu==='wand'?'Wänden':'Decke'}), Decke flach ${fmt(c.deckeFlach)} m²\n`;
      else if (r.form==='treppe') t+=`Treppenhaus: ${r.l} × ${r.b} m Grundriss, Gesamthöhe ${r.h} m${r.geschosse?`, ${r.geschosse} Geschosse`:''}\n`;
      else t+=`L ${r.l} × B ${r.b} m, Höhe ${r.h} m\n`;
    }
    for (const a of r.abzuege||[]){ const o=oeffnung(a);
      t+=`${a.art} ${a.n||1}× ${a.b} × ${a.h} m: ${!o?'':!o.abziehen?'übermessen':`abgezogen −${fmt(o.gesamt)} m²${o.leibung?`, Leibung +${fmt(o.leibung)} m² (Tiefe ${a.t} m, ${o.seiten} Seiten)`:''}`}\n`; }
    for (const f of r.fotoFlaechen||[]) t+=`${f.label||'Fläche'} (aus Foto): ${f.typ==='minus'?'−':'+'}${f.m2} m²\n`;
    for (const x of r.pos) t+=`${x.label||'Position'}: ${fmtMenge(x)} ${POS_UNITS[x.art]}${hkZusatz(x)}${x.art==='lfm'&&(x.werte||[]).filter(Boolean).length>1?` (${x.werte.filter(Boolean).join(' + ')})`:''}\n`;
    if (r.typ==='fassade') t+=`Fassadenfläche (VOB): ${fmt(c.fassade)} m²${c.sockel?` | Sockel: ${fmt(c.sockel)} m²`:''}\n`;
    else t+=`Wandfläche (VOB): ${fmt(c.wand)} m² | Decke: ${fmt(c.decke)} m² | Umfang: ${fmt(c.umfang)} m\n`;
    for (const [k,tt] of flaechenVon(r)){ const s=flaecheText(r.flaechen[k]); if (s) t+=`${tt}: ${s}\n`; }
    if ((r.arbeiten||[]).length) t+=`Sonstiges: ${r.arbeiten.join(', ')}\n`;
    if (r.notiz) t+=`Notiz: ${r.notiz}\n`;
    t+='\n';
  }
  if (sW||sD) t+=`SUMME Wände: ${fmt(sW)} m² | Decken: ${fmt(sD)} m²\n`;
  if (sF||sS) t+=`SUMME Fassade: ${fmt(sF)} m² | Sockel: ${fmt(sS)} m²\n`;
  for (const e of posSumme(rooms)) t+=`SUMME ${e.label}: ${e.art==='stk'?fmt(e.menge,0):fmt(e.menge)} ${POS_UNITS[e.art]}\n`;
  return t;
}
async function shareText(text){
  if (navigator.share){ try{ await navigator.share({text}); return; }catch(e){ if(e.name==='AbortError') return; } }
  try{ await navigator.clipboard.writeText(text); toast('In Zwischenablage kopiert'); }
  catch{ prompt('Text kopieren:', text); }
}

/* =========================================================
   Foto ausmessen mit Referenzmaß
   (z. B. Fassadenbreite mit DISTO messen → im Foto als Referenz
   markieren → Giebelhöhe, Flächen usw. im Foto abgreifen)
   ========================================================= */
function openMeasure(photo, ctx, onChange){
  const ov = document.createElement('div'); ov.className = 'mov';
  ov.innerHTML = `
    <div class="mtop"><button class="btn sec small" id="mx">Abbrechen</button>
      <div id="mhint" class="mhint"></div>
      <button class="btn small" id="mok">Speichern</button></div>
    <div class="mstage" id="mstage"><canvas id="mc"></canvas><canvas id="mloupe" width="300" height="300" hidden></canvas></div>
    <div class="mbar">
      <div class="seg" id="mtools" style="margin-bottom:8px">
        <button data-t="ref">① Referenz</button><button data-t="line">Strecke</button><button data-t="area">Fläche</button></div>
      <div class="row" style="align-items:flex-end">
        <label class="f measure" style="margin:0"><span>Referenzmaß (echte Länge)</span>
          <input id="mref" data-solo inputmode="decimal" autocomplete="off" placeholder="z. B. 8,50"><span class="unit">m</span></label>
        <button class="btn sec small" id="mundo" style="flex:none;margin-bottom:2px">↶</button>
        <button class="btn small" id="mclose" style="flex:none;margin-bottom:2px" hidden>Fläche schließen</button>
      </div>
      <div id="mlist" style="margin-top:8px"></div>
    </div>`;
  document.body.appendChild(ov);
  document.body.style.overflow = 'hidden';

  const stage = $('#mstage', ov), cv = $('#mc', ov), cx = cv.getContext('2d');
  const loupe = $('#mloupe', ov), lx = loupe.getContext('2d');
  const refIn = $('#mref', ov);
  const M = JSON.parse(JSON.stringify(photo.messung || {ref:null, refLen:'', items:[]}));
  refIn.value = M.refLen || '';
  let tool = M.ref ? 'line' : 'ref', cur = [];
  let W=0, H=0, dpr=1, scale=1, ox=0, oy=0, fitScale=1;
  const img = new Image();

  const pxPerM = () => { const L = num(refIn.value); return (M.ref && L) ? dist(M.ref[0], M.ref[1]) / L : null; };
  const dist = (a,b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
  const areaPx = pts => Math.abs(pts.reduce((s,p,i)=>{ const q=pts[(i+1)%pts.length]; return s + p[0]*q[1] - q[0]*p[1]; },0))/2;
  const toScreen = p => [p[0]*scale+ox, p[1]*scale+oy];
  const toImage  = (x,y) => [(x-ox)/scale, (y-oy)/scale];
  const valueOf = it => { const k = pxPerM(); if (!k) return null;
    return it.t==='line' ? dist(it.pts[0], it.pts[1])/k : areaPx(it.pts)/(k*k); };

  function resize(){
    const r = stage.getBoundingClientRect(); dpr = window.devicePixelRatio || 1;
    W = r.width; H = r.height; cv.width = W*dpr; cv.height = H*dpr;
    cv.style.width = W+'px'; cv.style.height = H+'px';
  }
  function fit(){
    fitScale = scale = Math.min(W/img.naturalWidth, H/img.naturalHeight);
    ox = (W - img.naturalWidth*scale)/2; oy = (H - img.naturalHeight*scale)/2;
  }

  // Zeichnen (für Bildschirm und für das gespeicherte Bild)
  function drawOverlay(g, tf, lw, fs){
    const line = (a,b,col,dash) => { g.save(); g.strokeStyle=col; g.lineWidth=lw; if(dash) g.setLineDash([lw*3,lw*2]);
      g.beginPath(); g.moveTo(...tf(a)); g.lineTo(...tf(b)); g.stroke(); g.restore(); };
    const dot = (p,col) => { const s=tf(p); g.beginPath(); g.arc(s[0],s[1],lw*2.2,0,7); g.fillStyle='#fff'; g.fill();
      g.lineWidth=lw*0.8; g.strokeStyle=col; g.stroke(); };
    const label = (p, txt, col) => { const s=tf(p); g.font=`700 ${fs}px -apple-system,Segoe UI,sans-serif`;
      const w=g.measureText(txt).width+fs*0.8, h=fs*1.5; g.fillStyle=col; g.beginPath();
      g.roundRect ? g.roundRect(s[0]-w/2, s[1]-h-fs*0.4, w, h, fs*0.3) : g.rect(s[0]-w/2, s[1]-h-fs*0.4, w, h); g.fill();
      g.fillStyle = col==='#ffd60a' ? '#000' : '#fff'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(txt, s[0], s[1]-h/2-fs*0.4); };
    const mid = (a,b) => [(a[0]+b[0])/2, (a[1]+b[1])/2];
    const k = pxPerM();
    M.items.forEach((it,i)=>{
      const v = valueOf(it), nr = `${i+1}`;
      if (it.t==='line'){ line(it.pts[0], it.pts[1], '#e5243b'); it.pts.forEach(p=>dot(p,'#e5243b'));
        label(mid(it.pts[0], it.pts[1]), `${nr}: ${v!=null?fmt(v)+' m':'?'}`, '#e5243b'); }
      else { g.save(); g.beginPath(); it.pts.forEach((p,j)=>{ const s=tf(p); j?g.lineTo(...s):g.moveTo(...s); }); g.closePath();
        g.fillStyle='rgba(229,36,59,.25)'; g.fill(); g.lineWidth=lw; g.strokeStyle='#e5243b'; g.stroke(); g.restore();
        it.pts.forEach(p=>dot(p,'#e5243b'));
        const c=[it.pts.reduce((s,p)=>s+p[0],0)/it.pts.length, it.pts.reduce((s,p)=>s+p[1],0)/it.pts.length];
        label(c, `${nr}: ${v!=null?fmt(v)+' m²':'?'}`, '#e5243b'); }
    });
    if (M.ref){ line(M.ref[0], M.ref[1], '#ffd60a'); M.ref.forEach(p=>dot(p,'#d4a800'));
      label(mid(M.ref[0], M.ref[1]), `Referenz ${k?fmt(num(refIn.value))+' m':'?'}`, '#ffd60a'); }
    if (cur.length){
      for (let i=1;i<cur.length;i++) line(cur[i-1], cur[i], tool==='ref'?'#ffd60a':'#4da3ff', true);
      cur.forEach(p=>dot(p, '#4da3ff'));
    }
  }
  function draw(){
    cx.setTransform(dpr,0,0,dpr,0,0); cx.clearRect(0,0,W,H);
    cx.fillStyle='#111'; cx.fillRect(0,0,W,H);
    if (img.complete) cx.drawImage(img, ox, oy, img.naturalWidth*scale, img.naturalHeight*scale);
    drawOverlay(cx, toScreen, 2.5, 13);
  }
  function drawLoupe(p, sx, sy){
    loupe.hidden = false;
    const z = Math.max(scale*3, fitScale*4), S = 300, half = S/(2*z);
    lx.setTransform(1,0,0,1,0,0); lx.clearRect(0,0,S,S); lx.fillStyle='#111'; lx.fillRect(0,0,S,S);
    lx.drawImage(img, p[0]-half, p[1]-half, half*2, half*2, 0, 0, S, S);
    const tf = q => [(q[0]-p[0]+half)*z, (q[1]-p[1]+half)*z];
    drawOverlay(lx, tf, 3, 18);
    lx.strokeStyle='#fff'; lx.lineWidth=2; lx.beginPath(); lx.moveTo(S/2-25,S/2); lx.lineTo(S/2+25,S/2); lx.moveTo(S/2,S/2-25); lx.lineTo(S/2,S/2+25); lx.stroke();
    loupe.style.left = (sx < W/2 ? W-160 : 10) + 'px';
  }

  function hint(){
    const h = $('#mhint', ov);
    if (tool==='ref') h.textContent = M.ref && !cur.length ? 'Referenz gesetzt. Maß unten eintragen oder neu antippen.' :
      'Anfang und Ende einer bekannten Länge antippen (z. B. Fassadenbreite, mit DISTO gemessen).';
    else if (!pxPerM()) h.textContent = 'Zuerst ① Referenz setzen und echtes Maß eintragen.';
    else if (tool==='line') h.textContent = 'Anfang und Ende der Strecke antippen.';
    else h.textContent = cur.length>=3 ? 'Weitere Ecken antippen oder „Fläche schließen“.' : 'Ecken der Fläche nacheinander antippen.';
    $$('#mtools button', ov).forEach(b=>b.classList.toggle('on', b.dataset.t===tool));
    $('#mclose', ov).hidden = !(tool==='area' && cur.length>=3);
  }

  function list(){
    const fields = ctx.fields();
    $('#mlist', ov).innerHTML = M.items.length ? M.items.map((it,i)=>{
      const v = valueOf(it);
      return `<div class="sub" style="margin-bottom:8px">
        <div class="head"><b style="flex:none">${i+1}</b>
          <input data-ml="${i}" value="${esc(it.label||'')}" placeholder="${it.t==='line'?'z. B. Giebelhöhe':'z. B. Giebelfläche'}">
          <b style="flex:none;white-space:nowrap">${v!=null ? fmt(v)+(it.t==='line'?' m':' m²') : '–'}</b>
          <button class="x" data-mdel="${i}">✕</button></div>
        ${v==null ? '' : it.t==='line'
          ? `<select data-mset="${i}"><option value="">→ In Feld übernehmen …</option>${fields.map(f=>`<option value="${esc(f.key)}">${esc(f.label)}</option>`).join('')}</select>`
          : `<div class="actions"><button class="btn sec small" data-madd="${i}|plus">+ zur Fläche</button>
             <button class="btn sec small" data-madd="${i}|minus">− abziehen</button></div>`}
      </div>`; }).join('')
      : '<p class="muted" style="font-size:13px;margin:0">Noch keine Messungen. Tipp: Foto möglichst gerade von vorne aufnehmen – die Referenz muss in derselben Ebene liegen wie das, was du misst.</p>';
    $$('[data-ml]', ov).forEach(s=>s.oninput=()=>{ M.items[+s.dataset.ml].label = s.value; });
    $$('[data-mdel]', ov).forEach(b=>b.onclick=()=>{ M.items.splice(+b.dataset.mdel,1); list(); draw(); });
    $$('[data-mset]', ov).forEach(s=>s.onchange=()=>{
      if (!s.value) return; const it=M.items[+s.dataset.mset];
      ctx.setLength(s.value, valueOf(it)); toast(`${fmt(valueOf(it))} m übernommen`);
      it.label ||= s.options[s.selectedIndex].text; list();
    });
    $$('[data-madd]', ov).forEach(b=>b.onclick=()=>{
      const [i,typ]=b.dataset.madd.split('|'), it=M.items[+i];
      if (!(valueOf(it) > 0)){ toast('Fläche ist 0 – Ecken prüfen'); return; }
      ctx.addArea(it.label || `Fläche ${+i+1} aus Foto`, valueOf(it), typ);
      toast(typ==='minus' ? 'Als Abzug übernommen' : 'Zur Fläche addiert'); b.disabled = true;
    });
  }
  const update = () => { draw(); hint(); list(); };

  function addPoint(p){
    cur.push(p);
    if (tool==='ref' && cur.length===2){ M.ref = cur; cur = []; if (!num(refIn.value)) refIn.focus(); tool = 'line'; if (!num(refIn.value)) tool='ref'; }
    else if (tool==='line' && cur.length===2){ M.items.push({t:'line', pts:cur, label:''}); cur = []; }
    update();
  }

  // Touch: Tippen = Punkt, Punkt ziehen = verschieben (mit Lupe), 1 Finger ziehen = Bild verschieben, 2 Finger = Zoom
  const ptrs = new Map(); let drag=null, pan=null, pinch=null, moved=false;
  const allPts = () => [...(M.ref||[]), ...M.items.flatMap(i=>i.pts), ...cur];
  const pos = e => { const r=stage.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  cv.addEventListener('pointerdown', e=>{
    cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, pos(e)); moved=false;
    if (ptrs.size===2){
      drag=null; pan=null; const [a,b]=[...ptrs.values()];
      pinch={d:dist(a,b), c:[(a[0]+b[0])/2,(a[1]+b[1])/2], s:scale, ox, oy}; return;
    }
    const s = pos(e);
    drag = allPts().find(p=>dist(toScreen(p), s) < 26) || null;
    pan = drag ? null : {s, ox, oy};
  });
  cv.addEventListener('pointermove', e=>{
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, pos(e));
    if (pinch && ptrs.size===2){
      const [a,b]=[...ptrs.values()], d=dist(a,b), c=[(a[0]+b[0])/2,(a[1]+b[1])/2];
      const ns = Math.min(fitScale*15, Math.max(fitScale*0.5, pinch.s*d/pinch.d));
      const ix=(pinch.c[0]-pinch.ox)/pinch.s, iy=(pinch.c[1]-pinch.oy)/pinch.s;
      scale=ns; ox=c[0]-ix*ns; oy=c[1]-iy*ns; moved=true; draw(); return;
    }
    const s = pos(e);
    if (drag){ const ip = toImage(...s); drag[0]=ip[0]; drag[1]=ip[1]; moved=true; draw(); drawLoupe(drag, s[0], s[1]); return; }
    if (pan && dist(s, pan.s) > 8){ moved=true; ox = pan.ox + s[0]-pan.s[0]; oy = pan.oy + s[1]-pan.s[1]; draw(); }
  });
  const up = e=>{
    if (!ptrs.has(e.pointerId)) return;
    const s = pos(e); ptrs.delete(e.pointerId);
    if (pinch){ if (ptrs.size===0) pinch=null; return; }
    loupe.hidden = true;
    if (drag){ const d=drag; drag=null; if (!moved) addPoint([d[0], d[1]]); else update(); pan=null; return; }
    if (!moved && e.type==='pointerup') addPoint(toImage(...s));
    pan=null;
  };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  stage.addEventListener('wheel', e=>{ e.preventDefault(); const s=pos(e), f=e.deltaY<0?1.15:1/1.15;
    const ns=Math.min(fitScale*15, Math.max(fitScale*0.5, scale*f)); ox=s[0]-(s[0]-ox)*ns/scale; oy=s[1]-(s[1]-oy)*ns/scale; scale=ns; draw(); }, {passive:false});

  $$('#mtools button', ov).forEach(b=>b.onclick=()=>{ tool=b.dataset.t; cur=[]; update(); });
  $('#mundo', ov).onclick = ()=>{ if (cur.length) cur.pop(); else if (M.items.length) M.items.pop(); else M.ref=null; update(); };
  $('#mclose', ov).onclick = ()=>{ if (cur.length<3) return; M.items.push({t:'area', pts:cur, label:''}); cur=[]; update(); };
  refIn.addEventListener('input', ()=>{
    M.refLen = refIn.value;
    if (tool==='ref' && M.ref && num(refIn.value) && !cur.length) tool = 'line';
    update();
  });
  refIn.addEventListener('blur', ()=>{ const n=num(refIn.value); if (n!=null){ refIn.value = fmtM(n); M.refLen = refIn.value; }
    if (tool==='ref' && M.ref && n) { tool='line'; update(); } });
  // DISTO: Referenzmaß direkt messen
  const alteZiel = Disto.target;
  if (Disto.connected) Disto.setTarget(refIn);
  refIn.addEventListener('focus', ()=>{ if (Disto.connected){ Disto.setTarget(refIn); refIn.blur(); } });

  const schliessen = () => { document.body.style.overflow=''; Disto.setTarget(null); Disto.target = null; ov.remove(); window.removeEventListener('resize', onResize); };
  $('#mx', ov).onclick = ()=>{ schliessen(); ctx.done(); };
  $('#mok', ov).onclick = async ()=>{
    M.refLen = refIn.value;
    photo.messung = M;
    // Bild mit eingezeichneten Maßen speichern (für Bericht und Vorschau)
    if (M.ref || M.items.length){
      const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
      const g = c.getContext('2d'); g.drawImage(img, 0, 0);
      const base = Math.max(c.width, c.height);
      drawOverlay(g, p=>p, Math.max(2, base/400), Math.max(14, base/45));
      photo.annot = await new Promise(r=>c.toBlob(r, 'image/jpeg', 0.85));
    } else delete photo.annot;
    await put('photos', photo);
    schliessen(); toast('Messung gespeichert');
    ctx.done(); onChange && onChange();
  };
  const onResize = () => { resize(); fit(); draw(); };
  window.addEventListener('resize', onResize);
  img.onload = () => { resize(); fit(); update(); };
  img.src = URL.createObjectURL(photo.blob);
}

   Datensicherung

function viewData(){
  setHeader('Daten & Sicherung', {back:true});
  app.innerHTML = `
    <div class="card">
      <h2>Sicherung</h2>
      <p style="margin-top:0">Alle Daten liegen <b>nur auf diesem iPhone</b>. Mach ab und zu eine Sicherung (z. B. in iCloud Drive oder per Mail an dich).</p>
      <button class="btn block" id="exp" style="margin-bottom:10px">Sicherung erstellen</button>
      <label class="btn sec block"><input type="file" accept=".json,application/json" id="imp" hidden>Sicherung einspielen</label>
      <p class="muted" id="usage" style="font-size:14px;margin-bottom:0"></p>
    </div>
    <div class="card"><h2>Kalkulation</h2><p style="margin-top:0">Stundensatz, Wagnis &amp; Gewinn, Aufwandswerte und Materialpreise.</p>
      <a class="btn sec block" href="#/kalkulation">⚙︎ Kalkulation bearbeiten</a></div>
    <div class="card"><h2>Hilfe</h2><a href="#/hilfe">Leica DISTO verbinden & benutzen</a></div>`;
  if (navigator.storage?.estimate) navigator.storage.estimate().then(e=>{
    $('#usage').textContent=`Belegter Speicher: ${(e.usage/1048576).toFixed(1)} MB · Letzte Sicherung: ${letzteSicherung() ? new Date(letzteSicherung()).toLocaleDateString('de-DE')+' ('+vorTagen(letzteSicherung())+')' : 'noch keine'}`;
  });
  $('#exp').onclick = exportAll;
  $('#imp').onchange = e => importAll(e.target.files[0]);
}
const blobToB64 = b => new Promise(r=>{ const f=new FileReader(); f.onload=()=>r(f.result); f.readAsDataURL(b); });
/* Erinnerung an die Sicherung */
const TAG = 86400000;
const ls = { get(k){ try{ return localStorage.getItem(k); }catch{ return null; } },
             set(k,v){ try{ localStorage.setItem(k, v); }catch{} } };
const letzteSicherung = () => +ls.get('sicherung:zuletzt') || 0;
const erinnerungPausiert = () => (+ls.get('sicherung:spaeter') || 0) > Date.now();
function vorTagen(t){ const d = Math.floor((Date.now()-t)/TAG); return d<=0 ? 'heute' : d===1 ? 'gestern' : `vor ${d} Tagen`; }
// Gibt es Änderungen, die noch nicht gesichert sind?
async function ungesichert(){
  const projects = await all('projects');
  if (!projects.length) return null;
  const geaendert = Math.max(...projects.map(p=>p.updated||p.created||0));
  const aeltestes = Math.min(...projects.map(p=>p.created||Date.now()));
  return geaendert > letzteSicherung() ? {geaendert, aeltestes, fertig: projects.some(p=>p.fertig)} : null;
}
function sicherungsHinweis(titel){
  return `<div class="card backup noprint" style="border:2px solid var(--yellow)">
    <div style="display:flex;gap:12px;align-items:flex-start"><div style="font-size:30px;line-height:1">💾</div>
      <div style="flex:1"><b>${titel}</b>
        <div class="muted" style="font-size:14px;margin-top:2px">Deine Aufmaße liegen nur auf diesem iPhone. Sichern → „In Dateien sichern“ → iCloud Drive.</div></div></div>
    <div class="row" style="margin-top:10px"><button class="btn" data-sichern>Jetzt sichern</button>
      <button class="btn sec" data-spaeter style="flex:none">Später</button></div></div>`;
}
function bindHinweis(){
  $$('[data-sichern]').forEach(b=>b.onclick=async()=>{ if (await exportAll()) $$('.backup').forEach(x=>x.remove()); });
  $$('[data-spaeter]').forEach(b=>b.onclick=()=>{ ls.set('sicherung:spaeter', Date.now()+TAG); $$('.backup').forEach(x=>x.remove()); toast('Erinnerung morgen wieder'); });
}

async function exportAll(){
  toast('Sicherung wird erstellt …');
  const photos = await Promise.all((await all('photos')).map(async p=>({...p, blob: await blobToB64(p.blob), annot: p.annot ? await blobToB64(p.annot) : undefined})));
  const data = {app:'aufmass', version:1, exported:new Date().toISOString(),
    projects: await all('projects'), rooms: await all('rooms'), photos, kalk: ls.get('kalk')};
  const file = new File([JSON.stringify(data)], `Aufmass-Sicherung-${new Date().toISOString().slice(0,10)}.json`, {type:'application/json'});
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:'Aufmaß-Sicherung'}); return gesichert(); }catch(e){ if(e.name==='AbortError') return false; }
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=file.name; a.click();
  return gesichert();
}
function gesichert(){ ls.set('sicherung:zuletzt', Date.now()); ls.set('sicherung:spaeter', 0); toast('Sicherung erstellt ✓'); return true; }
async function importAll(file){
  if(!file) return;
  try{
    const data = JSON.parse(await file.text());
    if (data.app!=='aufmass') throw new Error('Keine Aufmaß-Sicherung');
    if (!confirm(`${data.projects.length} Baustellen einspielen? Vorhandene Einträge mit gleicher ID werden überschrieben.`)) return;
    for (const p of data.projects) await put('projects', p);
    for (const r of data.rooms) await put('rooms', r);
    if (data.kalk) ls.set('kalk', data.kalk);
    for (const ph of data.photos){ ph.blob = await (await fetch(ph.blob)).blob(); if (ph.annot) ph.annot = await (await fetch(ph.annot)).blob(); await put('photos', ph); }
    toast('Sicherung eingespielt'); location.hash='#/';
  }catch(e){ alert('Fehler beim Einspielen: '+e.message); }
}

          <button class="btn sec small" id="copyUrl" style="margin-top:6px">Adresse kopieren</button></li>
        <li>Bluetooth-Zugriff erlauben.</li>
        <li>Wichtig: <b>DISTO Plan schließen</b> und den DISTO <b>nicht</b> in den iPhone-Einstellungen koppeln.</li>
        <li>In Bluefy: Hilfe-Seite → „DISTO verbinden“.</li>
      </ol>
      <p class="muted" style="font-size:14px;margin-bottom:0">Die Daten liegen pro Browser getrennt. Nimm am besten für die Arbeit immer Bluefy.</p>
    </div>`}
    <div class="card">
      <h2>So wird gemessen</h2>
      <ol style="padding-left:20px;margin:0">
        <li>Maß-Feld antippen → es wird rot markiert („◀ DISTO“).</li>
        <li>Am DISTO die DIST-Taste drücken.</li>
        <li>Der Wert landet im Feld, die Markierung springt zum nächsten Feld: Länge → Breite → Höhe → Abzüge …</li>
      </ol>
    </div>
    <div class="card">
      <h2>Testfeld</h2>
      <label class="f measure"><span>Antippen und am DISTO messen</span>
        <input id="test" data-measure data-key="test" inputmode="decimal" autocomplete="off" placeholder="0,000"><span class="unit">m</span></label>
      <div id="testlog" class="muted" style="font-size:13px;font-family:ui-monospace,monospace;white-space:pre-wrap"></div>
    </div>
    <div class="card">
      <h2>Klappt es nicht?</h2>
      <p style="margin:0">Einfach die Zahl vom Display ins Feld tippen. Komma oder Punkt ist egal. Die App rechnet trotzdem alles aus.</p>
    </div>`;
  const t=$('#test'), log=$('#testlog'); const lines=[];
  const addLog = s => { lines.unshift(s); log.textContent = lines.slice(0,8).join('\n'); };
  t.addEventListener('focus', ()=>{ if (Disto.connected){ Disto.setTarget(t); t.blur(); } });
  t.addEventListener('input', ()=>{ const n=num(t.value); if(n!=null) addLog(`✅ Wert: ${fmtM(n)} m`); });
  t.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); t.blur(); } });
  Disto.onRaw = (uuid, hex, m) => { addLog(`${uuid.slice(0,8)}: ${hex}${m!=null?`  → ${fmtM(m)} m`:''}`); if (m!=null) setTimeout(()=>Disto.setTarget(t),50); };
  updateMeasureInputs();
  if (Disto.connected) Disto.setTarget(t);
  const cu=$('#copyUrl'); if (cu) cu.onclick=async()=>{ try{ await navigator.clipboard.writeText(url); toast('Adresse kopiert'); }catch{ prompt('Adresse:', url); } };
