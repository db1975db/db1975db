<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aufmaß</title>
<meta name="theme-color" content="#c41e3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aufmaß">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#f4f1ec; --card:#fff; --ink:#1d1b19; --muted:#6b655e; --line:#e3ddd4;
  --red:#c41e3a; --red-soft:#fbe9ec; --yellow:#ffd60a; --green:#1f8a4c; --green-soft:#e5f4ea;
  --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#141312; --card:#1f1d1b; --ink:#f2efe9; --muted:#a39c93; --line:#34302c;
    --red-soft:#3a1820; --green-soft:#16301f; --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(90px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:10;background:var(--red);color:#fff;
  padding:calc(env(safe-area-inset-top) + 10px) 16px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
#livebar{flex-basis:100%;display:flex;gap:8px;overflow-x:auto;margin:2px 0 -2px;font-variant-numeric:tabular-nums}
#livebar span{background:rgba(255,255,255,.18);border-radius:999px;padding:4px 10px;font-size:14px;white-space:nowrap}
#livebar b{font-weight:750}
/* Einklappbare Bereiche */
details.sec>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;margin:-14px;padding:14px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary h2{margin:0;flex:none}
details.sec>summary .sum{flex:1;min-width:0;text-align:right;color:var(--ink);font-size:14px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
details.sec>summary::after{content:"›";color:var(--muted);font-size:22px;line-height:1;transition:transform .15s}
details.sec[open]>summary::after{transform:rotate(90deg)}
details.sec[open]>summary{margin-bottom:0;padding-bottom:12px}
details.vor>summary{list-style:none;cursor:pointer;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:8px 0 6px}
details.vor>summary::-webkit-details-marker{display:none}
details.vor>summary::before{content:"▸ ";}
details.vor[open]>summary::before{content:"▾ ";}
.fabbar{position:fixed;left:16px;right:16px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:20;display:flex;gap:10px;max-width:728px;margin:0 auto}
.fabbar .btn{flex:1;padding:16px 10px;font-size:18px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.wahl{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wahl button{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:22px 10px;font:inherit;font-weight:700;font-size:18px}
.wahl button span{display:block;font-size:40px;margin-bottom:4px}
.fab.cam{left:auto;right:16px;width:62px;height:62px;padding:0;font-size:28px;border-radius:50%}
header h1{font-size:20px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:10px;
  font-size:16px;padding:8px 12px;font-weight:600}
main{padding:14px 16px;max-width:760px;margin:0 auto}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:14px;margin-bottom:14px;border:1px solid var(--line)}
.card h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px}
label.f{display:block;margin-bottom:10px}
label.f span{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
input,textarea,select{width:100%;font:inherit;font-size:18px;color:var(--ink);background:var(--bg);
  border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--red);background:var(--card)}
textarea{min-height:84px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;
  font:inherit;font-weight:600;padding:13px 16px;background:var(--red);color:#fff;cursor:pointer}
.btn.sec{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost{background:transparent;color:var(--red);padding:8px 6px}
.btn.block{width:100%}
.btn.small{padding:8px 12px;font-size:15px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:20;
  border-radius:999px;padding:16px 22px;font-size:18px;box-shadow:0 6px 20px rgba(196,30,58,.35)}
.list-item{display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow);
  text-decoration:none;color:inherit}
.list-item .t{font-weight:650;font-size:18px}
.list-item .s{color:var(--muted);font-size:14px;margin-top:2px}
.list-item .grow{flex:1;min-width:0}
.chev{color:var(--muted);font-size:22px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
/* Messfelder */
.measure{position:relative}
.measure input{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums;padding-right:40px}
.measure .unit{position:absolute;right:12px;bottom:13px;color:var(--muted);font-size:16px}
.measure input.hot{border-color:var(--red);box-shadow:0 0 0 4px var(--red-soft)}
.measure input.flash{animation:flash .9s}
.measure input.target{border-color:var(--red);box-shadow:0 0 0 4px var(--red-soft)}
.measure input.target+.unit::after{content:" ◀ DISTO";color:var(--red);font-weight:700;font-size:12px}
/* DISTO-Statusleiste */
#disto[hidden]{display:none}
#disto{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:21;display:flex;gap:6px;align-items:center}
#disto button{border:0;border-radius:999px;font:inherit;font-size:15px;font-weight:650;padding:12px 16px;
  background:var(--card);color:var(--ink);box-shadow:0 4px 14px rgba(0,0,0,.18);border:1.5px solid var(--line)}
#disto .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#aaa;margin-right:6px;vertical-align:1px}
#disto.on .dot{background:var(--green)}
#disto.busy .dot{background:var(--yellow)}
@keyframes flash{0%{background:var(--green-soft);border-color:var(--green)}100%{}}
.hint{font-size:14px;color:var(--muted);background:var(--red-soft);border-radius:10px;padding:10px 12px;margin-bottom:12px}
/* Ergebnis */
.results{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.res{background:var(--bg);border-radius:12px;padding:10px 12px}
.res .k{font-size:13px;color:var(--muted)}
.res .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.res.main{background:var(--red);color:#fff}.res.main .k{color:rgba(255,255,255,.8)}
/* Abzüge */
.sub{border:1px dashed var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.sub .head{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.sub .head select{flex:1}
.sub .measure input{font-size:19px;padding:11px 26px 11px 9px}
.sub .measure .unit{right:8px;font-size:14px}
.x{border:0;background:var(--bg);color:var(--muted);border-radius:10px;width:44px;height:44px;font-size:20px;flex:none}
/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;
  padding:9px 14px;font:inherit;font-size:15px}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
/* Fotos */
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;background:var(--bg)}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:100;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 12px)}
.viewer img{flex:1;min-height:0;object-fit:contain;width:100%}
.viewer .bar{display:flex;gap:10px;margin-top:10px}
.viewer input{background:#222;color:#fff;border-color:#444}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;font:inherit;font-size:15px;padding:9px;border-radius:9px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:650;box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:#222;color:#fff;padding:10px 16px;border-radius:999px;font-size:15px;z-index:200;
  opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.muted{color:var(--muted)}
a{color:var(--red)}
@media (prefers-color-scheme: dark){ a{color:#ff6b81} }
.actions{display:flex;gap:10px;flex-wrap:wrap}
.lbl{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:8px 0 6px}
.sub.fl{border-style:solid;background:var(--card)}
.sub.fl .chips{margin-bottom:4px}
.sub.fl .chip{padding:8px 12px;font-size:14px}
/* Foto-Messung */
.mov{position:fixed;inset:0;z-index:150;background:#111;display:flex;flex-direction:column}
.mtop{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;background:#1d1b19}
.mhint{flex:1;color:#fff;font-size:13px;line-height:1.3;text-align:center}
.mstage{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none}
.mstage canvas#mc{display:block;touch-action:none}
#mloupe{position:absolute;top:10px;width:150px;height:150px;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.5);pointer-events:none}
.mbar{background:var(--card);color:var(--ink);padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);max-height:42vh;overflow:auto}
/* Bericht */
.report{background:#fff;color:#111}
.report h1{font-size:22px;margin:0 0 4px}
.report .rtop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.report .small{font-size:13px;color:#555}
.report .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:14px 0 4px}
.report .kpi{background:#c41e3a;color:#fff;border-radius:10px;padding:8px 12px}
.report .kpi .k{font-size:12px;opacity:.85}.report .kpi .v{font-size:22px;font-weight:750;font-variant-numeric:tabular-nums}
.report tr.grp td{font-weight:700;color:#c41e3a;border-bottom:0;padding-top:10px;font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.report tr.sum td{font-weight:700;border-top:2px solid #333}
.report table.small{font-size:12px}
.report .rdet{margin-top:16px;border-top:1px solid #ddd;padding-top:10px}
.report .rdet>summary{cursor:pointer;font-weight:700;color:#c41e3a;list-style:none}
.report .rdet>summary::-webkit-details-marker{display:none}
.report .rdet>summary::before{content:"▸ "}.report .rdet[open]>summary::before{content:"▾ "}
.report .room{border-top:1px solid #eee;padding-top:8px;margin-top:10px}
.report .rhead{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.report .rhead span{color:#555;font-size:13px;text-align:right}
.report .rph{grid-template-columns:repeat(4,1fr);margin-top:6px}
@media print{ .report .rdet>summary{display:none} .report .rdet:not([open]){display:none} }
.report h2.rh{font-size:15px;text-transform:uppercase;letter-spacing:.05em;color:#c41e3a;margin:18px 0 4px}
.report table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 10px}
.report td,.report th{border-bottom:1px solid #ddd;padding:5px 4px;text-align:left}
.report td.n,.report th.n{text-align:right;font-variant-numeric:tabular-nums}
.report .room{page-break-inside:avoid;border-top:2px solid #c41e3a;padding-top:8px;margin-top:16px}
.report .rph{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.report .rph figure{margin:0}.report .rph img{width:100%;border-radius:4px}
.report figcaption{font-size:11px;color:#555}
@media print{
  header,.fab,.noprint{display:none!important}
  body{background:#fff;padding:0} main{padding:0;max-width:none}
  .card{box-shadow:none;border:0;padding:0}
}
</style>

<body>
<header>
  <button id="back" hidden>‹ Zurück</button>
  <h1 id="title">Aufmaß</h1>
  <button id="hdrAction" hidden></button>
  <div id="livebar" hidden></div>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>
<div id="disto" hidden><button id="distoBtn"><span class="dot"></span><span id="distoTxt">DISTO verbinden</span></button></div>

<script>
'use strict';
/* =========================================================
   Datenbank (IndexedDB) – alles bleibt auf dem iPhone
   ========================================================= */
const DB_NAME = 'aufmass', DB_VER = 1;
let dbp;
function db(){
  if (!dbp) dbp = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('projects', {keyPath:'id'});
      d.createObjectStore('rooms', {keyPath:'id'}).createIndex('projectId','projectId');
      const ph = d.createObjectStore('photos', {keyPath:'id'});
      ph.createIndex('roomId','roomId'); ph.createIndex('projectId','projectId');
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbp;
}
function req(r){ return new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function store(name, mode='readonly'){ return (await db()).transaction(name, mode).objectStore(name); }
const put    = async (s, v) => req((await store(s,'readwrite')).put(v));
const get    = async (s, id) => req((await store(s)).get(id));
const del    = async (s, id) => req((await store(s,'readwrite')).delete(id));
const all    = async (s) => req((await store(s)).getAll());
const byIdx  = async (s, idx, v) => req((await store(s)).index(idx).getAll(v));

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

/* =========================================================
   Hilfsfunktionen
   ========================================================= */
const $ = (sel, el=document) => el.querySelector(sel);
const $$ = (sel, el=document) => [...el.querySelectorAll(sel)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = $('#app');

// Zahl aus beliebigem Text lesen: "3.245", "3,245 m", "3245 mm" ...
function num(v){
  if (v === null || v === undefined) return null;
  let s = String(v).trim().toLowerCase();
  if (!s) return null;
  const mm = /mm\s*$/.test(s), cm = /cm\s*$/.test(s);
  const m = s.replace(/\s/g,'').match(/-?\d+(?:[.,]\d+)?/);
  if (!m) return null;
  let n = parseFloat(m[0].replace(',', '.'));
  if (isNaN(n)) return null;
  if (mm) n /= 1000; else if (cm) n /= 100;
  return n;
}
const fmt = (n, d=2) => (n === null || n === undefined || isNaN(n)) ? '–'
  : n.toLocaleString('de-DE', {minimumFractionDigits:d, maximumFractionDigits:d});
const fmtM = n => n == null ? '' : n.toLocaleString('de-DE', {minimumFractionDigits:3, maximumFractionDigits:3});
const fmtDate = s => s ? new Date(s).toLocaleDateString('de-DE') : '';

let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }

function debounce(fn, ms=400){
  let t = null, args;
  const d = (...a)=>{ args = a; clearTimeout(t); t = setTimeout(()=>{ t = null; fn(...args); }, ms); };
  d.flush = ()=>{ if (t){ clearTimeout(t); t = null; return fn(...args); } };
  return d;
}
let offenesSpeichern = null;   // wird vor jedem Seitenwechsel sofort ausgeführt

/* =========================================================
   Arbeiten & Material (immer Brillux)
   ========================================================= */
const SONSTIGES = ['Türen lackieren','Zargen lackieren','Fenster lackieren','Heizkörper lackieren','Sockelleisten',
  'Abdecken / Abkleben','Möbel rücken'];
const SONSTIGES_FASSADE = ['Fensterbänke streichen','Dachuntersicht streichen','Ortgang/Dachkasten streichen',
  'Fensterläden lackieren','Fallrohre lackieren','Abdecken / Abkleben','Gerüst'];
const VORARBEITEN = ['Alte Tapete entfernen','Untergrund reinigen','Risse ausbessern','Spachteln Q2','Spachteln Q3',
  'Spachteln Q4','Grundierung','Schimmelbehandlung'];
const VORARBEITEN_FASSADE = ['Reinigen (Hochdruck)','Algen-/Pilzbehandlung','Risse sanieren','Putz ausbessern',
  'Grundierung','Armierung mit Gewebe'];
const BELAEGE = ['Raufaser','Lightvlies 130','Vlies (andere)'];
const ANSTRICHE_INNEN = ['Brillux Superlux','Brillux Intromatt','Brillux Raulan'];
const ANSTRICHE_FASSADE = ['Brillux Silicon-Fassadenfarbe','Brillux Fassadenfarbe Acryl','Brillux Fassadenfarbe Silikat'];
const STANDARD_FASSADE = 'Brillux Silicon-Fassadenfarbe';
// Raufaser → Intromatt, glatte Flächen (Lightvlies 130, ohne Tapete) → Superlux
const standardAnstrich = belag => belag==='Raufaser' ? 'Brillux Intromatt' : 'Brillux Superlux';
const neueFlaeche = () => ({vor:[], belag:'', anstrich:'', anzahl:2, farbton:'', manuell:false});
const RAUM_FLAECHEN    = [['decke','Decke'], ['wand','Wände']];
const FASSADE_FLAECHEN = [['fassade','Fassade'], ['sockel','Sockel']];
const flaechenVon = r => r.typ==='fassade' ? FASSADE_FLAECHEN : RAUM_FLAECHEN;

// Kurzbeschreibung einer Fläche, z. B. "Spachteln Q2 · Raufaser · 2× Brillux Intromatt"
function flaecheText(f){
  if (!f) return '';
  return [...(f.vor||[]), f.belag ? f.belag+' tapezieren' : '', f.anstrich ? `${f.anzahl||2}× ${f.anstrich}${f.farbton?`, Farbton ${f.farbton}`:''}` : '']
    .filter(Boolean).join(' · ');
}

/* =========================================================
   Positionen: laufende Meter, Stück, Einzelflächen
   ========================================================= */
const POS_UNITS = {lfm:'lfm', stk:'Stk', m2:'m²'};
const POS_VORLAGEN = [
  ['Sockelleiste','lfm'], ['Heizkörper','stk'], ['Tür mit Zarge','stk'], ['Fenster','stk'],
  ['Fensterbank','lfm'], ['Acrylfuge','lfm'], ['Treppengeländer','lfm'], ['Rohrleitung','lfm'],
  ['Kantenschutz','lfm'], ['Steckdose/Schalter abkleben','stk'], ['Heizkörper (Fläche)','m2']
];
const POS_VORLAGEN_FASSADE = [
  ['Fensterbank','lfm'], ['Dachuntersicht','m2'], ['Ortgang/Dachkasten','lfm'], ['Fallrohr','lfm'],
  ['Fensterläden','stk'], ['Gesims','lfm'], ['Gerüst','m2']
];
// Ältere Daten auf den aktuellen Stand bringen
function migrateRoom(r){
  r.typ ||= 'raum';
  if (!r.pos){
    r.pos = (r.extra||[]).filter(x=>x.label||x.wert).map(x=>({id:uid(), label:x.label||'', art:'lfm', werte:[x.wert||'']}));
    r.extra = [];
  }
  r.abzuege ||= []; r.arbeiten ||= []; r.fotoFlaechen ||= [];
  if (!r.flaechen){
    const alt = r.arbeiten, decke = neueFlaeche(), wand = neueFlaeche();
    if (alt.includes('Decke streichen')) decke.anstrich = 'Brillux Superlux';
    if (alt.includes('Raufaser tapezieren')) wand.belag = 'Raufaser';
    else if (alt.includes('Vlies tapezieren')) wand.belag = 'Lightvlies 130';
    if (alt.includes('Wände streichen') || wand.belag) wand.anstrich = standardAnstrich(wand.belag);
    wand.vor = alt.filter(a=>VORARBEITEN.includes(a));
    const weg = ['Decke streichen','Wände streichen','Raufaser tapezieren','Vlies tapezieren', ...VORARBEITEN];
    r.arbeiten = alt.filter(a=>!weg.includes(a));
    r.flaechen = r.typ==='fassade' ? {fassade:neueFlaeche(), sockel:neueFlaeche()} : {decke, wand};
  }
  for (const f of Object.values(r.flaechen)) if (f && f.anstrich==='Brillux Fassadenfarbe Silikon') f.anstrich = STANDARD_FASSADE;
  return r;
}
function posMenge(x){
  if (x.art==='stk') return num(x.n) ?? 0;
  if (x.art==='m2'){ const b=num(x.b), h=num(x.h); return (b!=null&&h!=null) ? b*h*(num(x.n) ?? 1) : 0; }
  return (x.werte||[]).map(num).filter(v=>v!=null).reduce((a,b)=>a+b,0);
}
const fmtMenge = (x, m=posMenge(x)) => x.art==='stk' ? fmt(m,0) : fmt(m);
// Summe gleicher Positionen über mehrere Räume
function posSumme(rooms){
  const map = new Map();
  for (const r of rooms) for (const x of migrateRoom(r).pos){
    const key = (x.label||'Ohne Bezeichnung').trim()+'|'+x.art;
    const e = map.get(key) || {label:(x.label||'Ohne Bezeichnung').trim(), art:x.art, menge:0};
    e.menge += posMenge(x); map.set(key, e);
  }
  return [...map.values()];
}

/* =========================================================
   Berechnung: Raum (innen) und Fassadenseite
   ========================================================= */
function oeffnungenSumme(r){
  let abzug = 0, leibung = 0, uebermessen = 0;
  for (const a of r.abzuege||[]){
    const o = oeffnung(a); if (!o) continue;
    if (o.abziehen){ abzug += o.gesamt; leibung += o.leibung; } else uebermessen += o.gesamt;
  }
  let fotoPlus = 0, fotoMinus = 0;
  for (const f of r.fotoFlaechen||[]){ const m = num(f.m2)||0; if (f.typ==='minus') fotoMinus += m; else fotoPlus += m; }
  return {abzug, leibung, uebermessen, fotoPlus, fotoMinus};
}
function calc(r){
  migrateRoom(r);
  return r.typ==='fassade' ? calcFassade(r) : calcRaum(r);
}
function calcRaum(r){
  const L = num(r.l), B = num(r.b), H = num(r.h);
  let umfang = null, decke = null;
  if (r.form === 'walls'){
    const w = (r.walls||[]).map(x=>num(x.len)).filter(x=>x!=null);
    umfang = w.length ? w.reduce((a,b)=>a+b,0) : null;
    decke = num(r.deckeManuell);
  } else {
    if (L!=null && B!=null){ umfang = 2*(L+B); decke = L*B; }
  }
  const brutto = (umfang!=null && H!=null) ? umfang*H : null;
  const o = oeffnungenSumme(r);
  const wand = brutto!=null ? Math.max(0, brutto - o.abzug + o.leibung + o.fotoPlus - o.fotoMinus) : null;
  return {typ:'raum', umfang, decke, boden: decke, brutto, ...o, wand, fl:{decke, wand}};
}
function calcFassade(r){
  const B = num(r.b), H = num(r.h), GH = num(r.gh), GB = num(r.gb) ?? B, S = num(r.sockelH);
  const rechteck = (B!=null && H!=null) ? B*H : null;
  const giebel = (GB!=null && GH!=null) ? GB*GH/2 : 0;
  const o = oeffnungenSumme(r);
  const brutto = (rechteck!=null || giebel || o.fotoPlus) ? (rechteck||0) + giebel + o.fotoPlus : null;
  const sockel = (B!=null && S!=null) ? B*S : 0;
  const fassade = brutto!=null ? Math.max(0, brutto - sockel - o.abzug + o.leibung - o.fotoMinus) : null;
  return {typ:'fassade', rechteck, giebel, brutto, sockel, ...o, fassade, wand:null, decke:null, boden:null, umfang:null,
    fl:{fassade, sockel}};
}

/* Öffnungen nach VOB/C DIN 18363:
   bis 2,5 m² Einzelgröße übermessen (nicht abziehen, Leibung nicht extra),
   über 2,5 m² abziehen und Leibung dazurechnen. */
const UEBERMESS_GRENZE = 2.5;
function oeffnung(a){
  const b = num(a.b), h = num(a.h), n = num(a.n) ?? 1, t = num(a.t);
  if (b==null || h==null) return null;
  const einzel = b*h, gesamt = einzel*n;
  const abziehen = einzel > UEBERMESS_GRENZE + 1e-9;
  const seiten = a.seiten==4 ? 4 : 3;
  const leibLaenge = seiten===4 ? 2*h + 2*b : 2*h + b;
  const leibung = (abziehen && t) ? leibLaenge*t*n : 0;
  return {einzel, n, gesamt, abziehen, leibung, seiten, t};
}
function oeffnungInfo(a){
  const o = oeffnung(a);
  if (!o) return '';
  if (!o.abziehen) return `${fmt(o.einzel)} m² ≤ 2,5 m² → <b>übermessen</b> (nicht abgezogen)`;
  return `${fmt(o.einzel)} m² > 2,5 m² → <b>abgezogen</b> −${fmt(o.gesamt)} m²`
    + (o.t ? ` · Leibung <b>+${fmt(o.leibung)} m²</b>` : ` · <span style="color:var(--red)">Leibungstiefe fehlt</span>`);
}

/* =========================================================
   Leica DISTO direkt per Bluetooth (Web Bluetooth, z. B. Browser „Bluefy“)
   Leica-Dienst 3ab10100-…, Distanz = 3ab10101-… (Float32, Meter)
   ========================================================= */
const Disto = {
  SVC:  '3ab10100-f831-4395-b29d-570977d5bf94',
  DIST: '3ab10101-f831-4395-b29d-570977d5bf94',
  supported: !!(navigator.bluetooth && navigator.bluetooth.requestDevice),
  device: null, connected: false, target: null, onRaw: null, onFilled: null,

  ui(state, text){
    const box = $('#disto'); box.className = state || '';
    $('#distoTxt').textContent = text;
  },
  show(on){ $('#disto').hidden = !on || !this.supported; },

  async connect(){
    try{
      if (!this.device){
        this.device = await navigator.bluetooth.requestDevice({
          filters: [{namePrefix:'DISTO'}, {services:[this.SVC]}],
          optionalServices: [this.SVC]
        });
        this.device.addEventListener('gattserverdisconnected', ()=>this.lost());
      }
      this.ui('busy','Verbinde …');
      const server = await this.device.gatt.connect();
      const svc = await server.getPrimaryService(this.SVC);
      const chars = await svc.getCharacteristics();
      for (const c of chars){
        if (!(c.properties.notify || c.properties.indicate)) continue;
        c.addEventListener('characteristicvaluechanged', e=>this.data(c.uuid, e.target.value));
        await c.startNotifications();
        await new Promise(r=>setTimeout(r,150)); // DISTO braucht etwas Zeit zwischen den Anmeldungen
      }
      this.connected = true;
      this.ui('on', this.device.name || 'DISTO');
      toast('DISTO verbunden – jetzt messen');
      updateMeasureInputs();
    }catch(e){
      console.error(e);
      this.connected = false;
      this.ui('', 'DISTO verbinden');
      if (e.name !== 'NotFoundError') alert('Verbindung fehlgeschlagen: '+e.message+'\n\nTipp: DISTO Plan schließen, am DISTO Bluetooth aus- und wieder einschalten.');
    }
  },
  lost(){
    this.connected = false; this.ui('', 'DISTO getrennt – neu verbinden');
    updateMeasureInputs();
  },
  data(uuid, dv){
    const hex = [...new Uint8Array(dv.buffer)].map(b=>b.toString(16).padStart(2,'0')).join(' ');
    let meters = null;
    if (uuid.toLowerCase() === this.DIST && dv.byteLength >= 4) meters = dv.getFloat32(0, true);
    if (this.onRaw) this.onRaw(uuid, hex, meters);
    if (meters == null || !isFinite(meters)) return;
    if (navigator.vibrate) navigator.vibrate(40);
    const el = this.target && document.body.contains(this.target) ? this.target : null;
    if (!el){ toast(`Gemessen: ${fmtM(meters)} m – erst ein Feld antippen`); return; }
    el.value = fmtM(meters);
    el.dispatchEvent(new Event('input', {bubbles:true}));
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    if (el.hasAttribute('data-solo')){ this.setTarget(el); return; }
    const hooked = this.onFilled ? this.onFilled(el) : undefined;
    if (hooked !== undefined){ this.setTarget(hooked); return; }
    const fields = $$('[data-measure]'), next = fields[fields.indexOf(el)+1];
    this.setTarget(next || null);
  },
  setTarget(el){
    $$('.measure input.target').forEach(x=>x.classList.remove('target'));
    this.target = el;
    if (el){ const d=el.closest('details'); if (d && !d.open) d.open = true;
      el.classList.add('target'); el.scrollIntoView({block:'center', behavior:'smooth'}); }
  }
};
// Wenn der DISTO verbunden ist, keine Bildschirmtastatur bei Maß-Feldern (antippen = Ziel wählen)
function updateMeasureInputs(){
  $$('[data-measure]').forEach(el=>{
    if (Disto.connected){ el.setAttribute('inputmode','none'); }
    else { el.setAttribute('inputmode','decimal'); el.classList.remove('target'); }
  });
  if (Disto.connected && !(Disto.target && document.body.contains(Disto.target))){
    const fields = $$('[data-measure]');
    const first = fields.find(f=>!f.value) || fields[0];
    if (first) Disto.setTarget(first);
  }
}
$('#distoBtn').onclick = ()=>{
  if (Disto.connected){
    if (confirm('DISTO trennen?')){ Disto.device.gatt.disconnect(); }
  } else Disto.connect();
};

    for (const r of rooms) await del('rooms', r.id);

  $('#wFassade') && ($('#wFassade').onclick = ()=>neu(true));

  bar.innerHTML = `<button class="btn" id="bRaum">🏠 + Raum</button><button class="btn" id="bFassade">🧱 + Fassade</button>`;
  document.body.appendChild(bar);

                      : ['Fenster','Tür','Balkontür','Durchgang','Einbauschrank','Fliesenspiegel','Sonstiges'];
  const NAMEN = F ? ['Straßenseite','Gartenseite','Hofseite','Giebel Nord','Giebel Süd','Giebel Ost','Giebel West','Nordseite','Südseite','Ostseite','Westseite']
                  : ['Wohnzimmer','Schlafzimmer','Kinderzimmer','Küche','Bad','Gäste-WC','Flur','Treppenhaus','Esszimmer','Arbeitszimmer','Abstellraum','Keller','Büro','Diele'];

  function masseHtml(){
    if (F) return `
      <div class="row">${mField('b','Breite',r.b)}${mField('h','Höhe bis Traufe',r.h)}</div>
      <div class="row">${mField('gh','Giebelhöhe (über Traufe)',r.gh)}${mField('gb','Giebelbreite',r.gb)}</div>
      <p class="muted" style="font-size:13px;margin:-4px 0 10px">Giebel als Dreieck. Giebelbreite leer = Breite der Seite.</p>
      ${mField('sockelH','Sockelhöhe',r.sockelH)}`;
    return `
      <div class="seg">
        <button data-form="rect" class="${r.form==='rect'?'on':''}">Rechteckig</button>
        <button data-form="walls" class="${r.form==='walls'?'on':''}">Wände einzeln</button>
      </div>
      ${r.form==='rect' ? `<div class="row">${mField('l','Länge',r.l)}${mField('b','Breite',r.b)}</div>` : `
        ${r.walls.map((w,i)=>`<div class="row" style="align-items:flex-end">
          ${mField('wall:'+i, 'Wand '+(i+1), w.len)}
          <button class="x" data-delwall="${i}" style="margin-bottom:10px" aria-label="Wand löschen">✕</button></div>`).join('')}
        <button class="btn sec small" id="addWall" style="margin-bottom:12px">+ Wand</button>
        <label class="f measure"><span>Deckenfläche (falls nötig, z. B. aus DISTO-Flächenfunktion)</span>
          <input data-measure data-key="deckeManuell" inputmode="decimal" autocomplete="off" value="${esc(r.deckeManuell)}" placeholder="0,00"><span class="unit">m²</span></label>`}
      ${mField('h','Raumhöhe',r.h)}`;
  }

  function fotoFlaechenHtml(){
    if (!r.fotoFlaechen.length) return '';
    return `<div style="margin-top:6px"><div class="lbl">Flächen aus Foto-Messung</div>
      ${r.fotoFlaechen.map((f,i)=>`<div class="row" style="align-items:center;margin-bottom:6px">
        <div style="flex:3">${esc(f.label||'Fläche')}</div>
        <div style="flex:2;text-align:right;font-weight:700">${f.typ==='minus'?'−':'+'}${fmt(num(f.m2))} m²</div>
        <button class="x" data-delfoto="${i}" style="flex:none" aria-label="Fläche löschen">✕</button></div>`).join('')}</div>`;
  }

  function flaecheHtml(key, titel, menge){
    const f = r.flaechen[key] ||= neueFlaeche();
    const vorList = F ? VORARBEITEN_FASSADE : VORARBEITEN;
    const anstriche = F ? ANSTRICHE_FASSADE : ANSTRICHE_INNEN;
    const frei = f.anstrich && !anstriche.includes(f.anstrich) ? f.anstrich : '';
    return `<div class="sub fl">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px">
        <b style="font-size:18px">${titel}</b><span class="muted" id="fm-${key}">${fmt(menge)} m²</span></div>
      <details class="vor" ${f.vor.length?'open':''}><summary>Vorarbeiten${f.vor.length?` (${f.vor.length})`:''}</summary>
      <div class="chips">${vorList.map(v=>`<button class="chip ${f.vor.includes(v)?'on':''}" data-vor="${key}|${esc(v)}">${esc(v)}</button>`).join('')}</div></details>
      ${F ? '' : `<div class="lbl">Tapezieren</div>
      <div class="chips">${['', ...BELAEGE].map(b=>`<button class="chip ${f.belag===b?'on':''}" data-belag="${key}|${esc(b)}">${b?esc(b):'Keine Tapete'}</button>`).join('')}</div>`}
      <div class="lbl">Anstrich (Brillux)</div>
      <div class="chips">${['', ...anstriche].map(a=>`<button class="chip ${f.anstrich===a && (a||!frei)?'on':''}" data-an="${key}|${esc(a)}">${a?esc(a.replace('Brillux ','')):'Kein Anstrich'}</button>`).join('')}</div>
      <div class="row" style="align-items:center">
        <input data-anfrei="${key}" value="${esc(frei)}" placeholder="Anderes Brillux-Produkt …" style="flex:3">
        <select data-anz="${key}" style="flex:1">${[1,2,3].map(n=>`<option value="${n}" ${(+f.anzahl||2)===n?'selected':''}>${n}×</option>`).join('')}</select>
      </div>
      ${f.anstrich ? `<label class="f" style="margin:8px 0 0"><span>🎨 Farbton</span>
        <input data-farbe="${key}" value="${esc(f.farbton||'')}" list="farbtoene" autocomplete="off" placeholder="z. B. Weiß oder Brillux-Farbtonnummer"></label>` : ''}
    </div>`;
  }

  // Kurzfassungen für zugeklappte Bereiche
  const kurz = {
    masse: () => F ? (r.b||r.h ? `${r.b||'?'} × ${r.h||'?'} m${r.gh?' + Giebel':''}` : 'noch leer')
      : r.form==='walls' ? `${r.walls.filter(w=>w.len).length} Wände · H ${r.h||'?'}`
      : (r.l||r.b||r.h ? `${r.l||'?'} × ${r.b||'?'} × ${r.h||'?'} m` : 'noch leer'),
    abz: () => { const c=calc(r), n=r.abzuege.reduce((s,a)=>s+(num(a.n)??1),0);
      return n ? `${n} Öffnung${n>1?'en':''}${c.abzug?` · −${fmt(c.abzug)} m²`:''}${c.leibung?` · +${fmt(c.leibung)} Leibung`:''}` : 'keine'; },
    arb: () => { const t = flaechenVon(r).map(([k,tt])=>{ const f=r.flaechen[k]; if (!f) return '';
        const x=[f.belag, f.anstrich?f.anstrich.replace('Brillux ','')+(f.farbton?` (${f.farbton})`:''):''].filter(Boolean).join(' + '); return x?`${tt}: ${x}`:''; })
        .filter(Boolean); if (r.arbeiten.length) t.push(`+${r.arbeiten.length}`); return t.join(' · ') || 'noch nichts gewählt'; },
    pos: () => r.pos.length ? r.pos.map(x=>`${x.label||'Pos.'} ${fmtMenge(x)} ${POS_UNITS[x.art]}`).join(' · ') : 'keine',
  };
  const refreshSums = () => { for (const k in kurz){ const el=$('#sum-'+k); if (el) el.textContent = kurz[k](); } liveBar(); };
  function liveBar(){
    const c = calc(r), lb = $('#livebar');
    lb.innerHTML = F
      ? `<span>Fassade <b>${fmt(c.fassade)} m²</b></span><span>Sockel <b>${fmt(c.sockel)} m²</b></span>`
      : `<span>Wand <b>${fmt(c.wand)} m²</b></span><span>Decke <b>${fmt(c.decke)} m²</b></span><span>Umfang <b>${fmt(c.umfang)} m</b></span>`;
    lb.hidden = false;
  }

  function render(){
    const c = calc(r);
    const sonst = F ? SONSTIGES_FASSADE : SONSTIGES;
    const customChips = r.arbeiten.filter(a=>!sonst.includes(a));
    app.innerHTML = `
      <div class="card">
        <label class="f" style="margin:0"><span>${F?'Fassadenseite':'Raumbezeichnung'}</span>
          <input id="name" value="${esc(r.name)}" placeholder="${F?'z. B. Straßenseite':'z. B. Wohnzimmer EG'}" list="namen" autocomplete="off"></label>
        <datalist id="namen">${NAMEN.map(n=>`<option value="${n}">`).join('')}</datalist>
        <datalist id="farbtoene"></datalist>
      </div>

      ${sec('masse', 'Maße'+(F?' Fassade':''), kurz.masse(), `
        <div class="hint">📏 ${Disto.supported
          ? 'Feld antippen → am DISTO messen. Danach ist automatisch das nächste Feld dran.'
          : 'Zahl vom DISTO eintippen. <b>Direkte Übertragung:</b> Seite im Browser „Bluefy“ öffnen (siehe Hilfe).'}
          ${F?'<br>📷 Nicht erreichbare Maße: Foto von vorne → antippen → <b>„Ausmessen“</b>.':''}</div>
        ${masseHtml()}
        ${fotoFlaechenHtml()}`)}

      ${sec('abz', 'Abzüge', kurz.abz(), `
        ${r.abzuege.map((a,i)=>`<div class="sub">
          <div class="head">
            <select data-abz-art="${i}">${ABZ_ARTEN.concat(ABZ_ARTEN.includes(a.art)?[]:[a.art]).map(o=>`<option ${a.art===o?'selected':''}>${esc(o)}</option>`).join('')}</select>
            <button class="x" data-delabz="${i}" aria-label="Abzug löschen">✕</button>
          </div>
          <div class="row">
            ${mField('abz:'+i+':b','Breite',a.b)}
            ${mField('abz:'+i+':h','Höhe',a.h)}
            <label class="f" style="max-width:80px"><span>Anzahl</span><input data-abz-n="${i}" inputmode="numeric" value="${esc(a.n ?? 1)}"></label>
          </div>
          <div class="row" style="align-items:flex-end">
            ${mField('abz:'+i+':t','Leibungstiefe',a.t)}
            <label class="f"><span>Leibung (unten ohne/mit)</span><select data-abz-s="${i}">
              <option value="3" ${a.seiten==4?'':'selected'}>3 Seiten</option>
              <option value="4" ${a.seiten==4?'selected':''}>4 Seiten</option></select></label>
          </div>
          <div class="muted" style="font-size:14px" id="abzinfo-${i}">${oeffnungInfo(a)}</div></div>`).join('')}
        <div class="chips" style="margin:0 0 4px">
          ${(F?['Fenster','Haustür','Garagentor','Balkontür']:['Fenster','Tür','Balkontür','Durchgang']).map(a=>`<button class="chip" data-addabz="${a}">+ ${a}</button>`).join('')}
        </div>
        <p class="muted" style="font-size:13px;margin:4px 0 0">VOB: bis 2,5 m² übermessen, darüber abziehen + Leibung.</p>`)}

      ${sec('arb', 'Arbeiten', kurz.arb(), `
        ${flaechenVon(r).map(([k,t])=>flaecheHtml(k, t, c.fl[k])).join('')}
        <div class="lbl" style="margin-top:6px">Sonstiges</div>
        <div class="chips">
          ${[...sonst, ...customChips].map(a=>`<button class="chip ${r.arbeiten.includes(a)?'on':''}" data-chip="${esc(a)}">${esc(a)}</button>`).join('')}
        </div>
        <div class="row" style="margin-bottom:10px">
          <input id="newChip" placeholder="Eigene Arbeit hinzufügen …">
          <button class="btn small" id="addChip" style="flex:none">+</button>
        </div>
        <label class="f" style="margin:0"><span>Notiz</span>
          <textarea id="rnotiz" placeholder="${F?'z. B. Gerüst nötig, Putzschäden an der Ecke …':'z. B. Wasserfleck an der Decke, Möbel bleiben stehen …'}">${esc(r.notiz)}</textarea></label>`)}

      ${sec('pos', 'Positionen', kurz.pos(), `
        ${r.pos.map((x,i)=>posHtml(x,i)).join('')}
        <div class="chips" style="margin:4px 0 0">
          ${(F?POS_VORLAGEN_FASSADE:POS_VORLAGEN).map(([l,a])=>`<button class="chip" data-addpos="${esc(l)}|${a}">+ ${esc(l)} <span class="muted">${POS_UNITS[a]}</span></button>`).join('')}
          <button class="chip" data-addpos="|lfm">+ Eigene …</button>
        </div>`, false)}

      ${sec('fotos', 'Fotos', '', `
        <div class="photos" id="photos"></div>
        <div class="row">
          <label class="btn"><input type="file" accept="image/*" capture="environment" id="cam" hidden>📷 Foto aufnehmen</label>
          <label class="btn sec"><input type="file" accept="image/*" multiple id="gal" hidden>Aus Galerie</label>
        </div>
        <p class="muted" style="font-size:13px;margin:8px 0 0">Foto antippen → „📐 Ausmessen“: Strecken und Flächen über ein Referenzmaß bestimmen.</p>`)}

      ${sec('rechenweg', 'Rechenweg', 'Brutto, Abzüge, Leibungen', `<div class="results" id="results">${resultsHtml(c)}</div>`, false)}

      <button class="btn block" id="nextRoom" style="margin-bottom:10px">${F?'Nächste Fassadenseite →':'Nächster Raum →'}</button>
      <button class="btn block" id="fertig" style="margin-bottom:10px;background:var(--green)">✓ Fertig – kein weiterer ${F?'Teil':'Raum'}</button>
      <div class="actions">
        <button class="btn sec" id="delRoom" style="color:var(--red)">${F?'Fassadenseite':'Raum'} löschen</button>
      </div>
    `;
    bind();
    bindSecs();
    refreshSums();
    renderPhotos();
    farbVorschlaege().then(l=>{ const d=$('#farbtoene'); if (d) d.innerHTML = l.map(x=>`<option value="${esc(x)}">`).join(''); });
  }

  function posHtml(x,i){
    const head = `<div class="head">
        <input data-pos-label="${i}" value="${esc(x.label)}" placeholder="Bezeichnung" style="flex:2">
        <select data-pos-art="${i}" style="flex:1">${Object.entries(POS_UNITS).map(([k,v])=>`<option value="${k}" ${x.art===k?'selected':''}>${v}</option>`).join('')}</select>
        <button class="x" data-delpos="${i}" aria-label="Position löschen">✕</button></div>`;
    let body = '';
    if (x.art==='lfm'){
      x.werte ||= [''];
      body = x.werte.map((w,j)=>`<div class="row" style="align-items:flex-end">
          ${mField(`pos:${i}:w:${j}`, x.werte.length>1?`Teilstück ${j+1}`:'Länge', w)}
          ${x.werte.length>1?`<button class="x" data-delw="${i}:${j}" style="margin-bottom:10px" aria-label="Teilstück löschen">✕</button>`:''}</div>`).join('')
        + `<div class="actions" style="margin-bottom:8px">
            <button class="btn sec small" data-addw="${i}">+ Teilstück</button>
            ${F?'':`<button class="btn sec small" data-umfang="${i}">Umfang − Türen</button>`}</div>`;
    } else if (x.art==='stk'){
      body = `<div class="row" style="align-items:center;margin-bottom:8px">
          <button class="btn sec" data-stk="${i}:-1" style="flex:none;width:64px;font-size:24px">−</button>
          <input data-pos-n="${i}" inputmode="numeric" value="${esc(x.n ?? 0)}" style="text-align:center;font-size:26px;font-weight:700">
          <button class="btn" data-stk="${i}:1" style="flex:none;width:64px;font-size:24px">+</button></div>`;
    } else {
      body = `<div class="row">${mField(`pos:${i}:b`,'Breite',x.b)}${mField(`pos:${i}:h`,'Höhe',x.h)}
          <label class="f" style="max-width:80px"><span>Anzahl</span><input data-pos-n="${i}" inputmode="numeric" value="${esc(x.n ?? 1)}"></label></div>`;
    }
    return `<div class="sub">${head}${body}
      <div style="text-align:right;font-weight:700">Summe: <span id="postot-${i}">${fmtMenge(x)}</span> ${POS_UNITS[x.art]}</div></div>`;
  }
  const refreshPos = () => r.pos.forEach((x,i)=>{ const el=$('#postot-'+i); if (el) el.textContent=fmtMenge(x); });

  function resultsHtml(c){
    const tile = (k, v, main) => `<div class="res${main?' main':''}"><div class="k">${k}</div><div class="v">${v}</div></div>`;
    const foto = (c.fotoPlus ? tile('Foto-Flächen', `+${fmt(c.fotoPlus)} m²`) : '') + (c.fotoMinus ? tile('Foto-Abzüge', `−${fmt(c.fotoMinus)} m²`) : '');
    if (F) return tile('Fassade (VOB)', fmt(c.fassade)+' m²', true) + tile('Sockel', fmt(c.sockel)+' m²', true)
      + tile('Rechteck B × H', fmt(c.rechteck)+' m²') + tile('Giebel', fmt(c.giebel)+' m²')
      + tile('Abzüge (&gt; 2,5 m²)', `−${fmt(c.abzug)} m²`) + tile('Leibungen', `+${fmt(c.leibung)} m²`)
      + tile('Übermessen (≤ 2,5 m²)', fmt(c.uebermessen)+' m²') + foto;
    return tile('Wandfläche (VOB)', fmt(c.wand)+' m²', true) + tile('Deckenfläche', fmt(c.decke)+' m²', true)
      + tile('Bodenfläche', fmt(c.boden)+' m²') + tile('Umfang', fmt(c.umfang)+' m')
      + tile('Wand brutto', fmt(c.brutto)+' m²') + tile('Abzüge (&gt; 2,5 m²)', `−${fmt(c.abzug)} m²`)
      + tile('Leibungen', `+${fmt(c.leibung)} m²`) + tile('Übermessen (≤ 2,5 m²)', fmt(c.uebermessen)+' m²') + foto;
  }
  const refreshResults = () => {
    const c = calc(r);
    const el=$('#results'); if (el) el.innerHTML = resultsHtml(c); refreshPos();
    r.abzuege.forEach((a,i)=>{ const x=$('#abzinfo-'+i); if (x) x.innerHTML = oeffnungInfo(a); });
    for (const [k] of flaechenVon(r)){ const x=$('#fm-'+k); if (x) x.textContent = fmt(c.fl[k])+' m²'; }
    refreshSums();
  };

  function setVal(key, v){
    const parts = key.split(':');
    if (parts[0]==='wall') r.walls[+parts[1]].len = v;
    else if (parts[0]==='abz') r.abzuege[+parts[1]][parts[2]] = v;
    else if (parts[0]==='pos' && parts[2]==='w') r.pos[+parts[1]].werte[+parts[3]] = v;
    else if (parts[0]==='pos') r.pos[+parts[1]][parts[2]] = v;
    else r[key] = v;
  }

  function bind(){
    const nameEl = $('#name');
    nameEl.addEventListener('input', ()=>{ r.name=nameEl.value; $('#title').textContent=r.name||neuName; persist(); });
    nameEl.addEventListener('keydown', e=>{ if (e.key==='Enter'){ e.preventDefault(); const f=$('[data-measure]'); f && f.focus(); }});
    const gb = $('[data-key="gb"]'); if (gb){ gb.placeholder = 'wie Breite'; }

    const fields = $$('[data-measure]');
    fields.forEach((el, idx)=>{
      el.addEventListener('focus', ()=>{
        if (Disto.connected){ Disto.setTarget(el); el.blur(); return; }
        el.classList.add('hot'); el.select(); Disto.target = el;
      });
      el.addEventListener('blur', ()=>{
        el.classList.remove('hot');
        const n = num(el.value);
        if (n!=null && el.dataset.key!=='deckeManuell'){ el.value = fmtM(n); setVal(el.dataset.key, el.value); persist(); }
      });
      el.addEventListener('input', ()=>{ setVal(el.dataset.key, el.value); persist(); refreshResults(); });
      // Der DISTO schickt nach dem Messwert ein Enter (bzw. Tab) → nächstes Feld
      el.addEventListener('keydown', e=>{
        if (e.key==='Enter' || (e.key==='Tab' && !e.shiftKey)){
          e.preventDefault();
          el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
          const next = fields[idx+1];
          if (next) next.focus(); else el.blur();
        }
      });
    });

    updateMeasureInputs();

    $$('[data-form]').forEach(b=>b.onclick=()=>{
      r.form=b.dataset.form;
      if (r.form==='walls' && !r.walls.length) r.walls=[{len:''},{len:''},{len:''},{len:''}];
      persist(); render();
    });
    $('#addWall') && ($('#addWall').onclick=()=>{ r.walls.push({len:''}); persist(); render(); focusKey('wall:'+(r.walls.length-1)); });
    $$('[data-delwall]').forEach(b=>b.onclick=()=>{ r.walls.splice(+b.dataset.delwall,1); persist(); render(); });
    $$('[data-delfoto]').forEach(b=>b.onclick=()=>{ r.fotoFlaechen.splice(+b.dataset.delfoto,1); persist(); render(); });

    $$('[data-addabz]').forEach(b=>b.onclick=()=>{
      r.abzuege.push({art:b.dataset.addabz, b:'', h:'', n:1}); persist(); render(); focusKey('abz:'+(r.abzuege.length-1)+':b'); });
    $$('[data-delabz]').forEach(b=>b.onclick=()=>{ r.abzuege.splice(+b.dataset.delabz,1); persist(); render(); });
    $$('[data-abz-art]').forEach(s=>s.onchange=()=>{ r.abzuege[+s.dataset.abzArt].art=s.value; persist(); });
    $$('[data-abz-n]').forEach(s=>s.oninput=()=>{ r.abzuege[+s.dataset.abzN].n=s.value; persist(); refreshResults(); });
    $$('[data-abz-s]').forEach(s=>s.onchange=()=>{ r.abzuege[+s.dataset.abzS].seiten=+s.value; persist(); refreshResults(); });

    // Arbeiten je Fläche (Decke / Wände bzw. Fassade / Sockel)
    const fl = k => r.flaechen[k] ||= neueFlaeche();
    $$('[data-vor]').forEach(b=>b.onclick=()=>{
      const [k,v]=b.dataset.vor.split('|'), f=fl(k), i=f.vor.indexOf(v);
      if (i>=0) f.vor.splice(i,1); else f.vor.push(v);
      b.classList.toggle('on'); persist(); refreshSums();
      const sm = b.closest('details.vor')?.querySelector('summary'); if (sm) sm.textContent = 'Vorarbeiten' + (f.vor.length?` (${f.vor.length})`:'');
    });
    $$('[data-belag]').forEach(b=>b.onclick=()=>{
      const [k,v]=b.dataset.belag.split('|'), f=fl(k);
      f.belag = v;
      // Passender Brillux-Anstrich, solange nicht von Hand gewählt
      if (!f.manuell && (v || f.anstrich)) f.anstrich = standardAnstrich(v);
      persist(); render();
      if (v && !f.manuell) toast(`Anstrich: ${f.anstrich}`);
    });
    $$('[data-an]').forEach(b=>b.onclick=()=>{
      const [k,v]=b.dataset.an.split('|'), f=fl(k);
      f.anstrich = v; f.manuell = true; persist(); render();
    });
    $$('[data-anfrei]').forEach(s=>s.oninput=()=>{
      const f=fl(s.dataset.anfrei); f.anstrich = s.value.trim(); f.manuell = true; persist(); refreshSums();
      $$(`[data-an^="${s.dataset.anfrei}|"]`).forEach(c=>c.classList.toggle('on', !f.anstrich && c.dataset.an.endsWith('|')));
    });
    $$('[data-anz]').forEach(s=>s.onchange=()=>{ fl(s.dataset.anz).anzahl = +s.value; persist(); });
    $$('[data-farbe]').forEach(s=>s.oninput=()=>{ fl(s.dataset.farbe).farbton = s.value; persist(); refreshSums(); });

    // Positionen
    const lastPos = () => r.pos.length-1;
    $$('[data-addpos]').forEach(b=>b.onclick=()=>{
      const [label, art] = b.dataset.addpos.split('|');
      r.pos.push({id:uid(), label, art, werte:[''], n:1, b:'', h:''});
      try{ localStorage.setItem('sec:pos','1'); }catch{}
      persist(); render();
      const i=lastPos();
      if (!label) $(`[data-pos-label="${i}"]`).focus();
      else if (art==='lfm') focusKey(`pos:${i}:w:0`);

    });
    // DISTO: Leibung überspringen, wenn übermessen; nach letztem Teilstück ein neues anlegen

      img.onclick=()=>openViewer(p, renderPhotos, messCtx);

// Foto verkleinern (spart Speicher), max. 1600 px
function shrink(file, max=1600){
  return new Promise((res, rej)=>{
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{
      let w=img.naturalWidth, h=img.naturalHeight; const s=Math.min(1, max/Math.max(w,h));
      w=Math.round(w*s); h=Math.round(h*s);
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      c.toBlob(b=>b?res(b):rej(new Error('toBlob')), 'image/jpeg', 0.82);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('Bild nicht lesbar')); };
    img.src=url;
  });
}

function openViewer(p, onChange, messCtx){
  const v=document.createElement('div'); v.className='viewer';
  v.innerHTML=`<img src="${URL.createObjectURL(p.annot || p.blob)}" alt="">
    <input id="cap" placeholder="Beschriftung (z. B. Riss über Tür)" value="${esc(p.caption)}">
    <div class="bar"><button class="btn sec" id="vdel" style="flex:1;color:var(--red)">Löschen</button>
    ${messCtx?'<button class="btn sec" id="vmess" style="flex:1.4">📐 Ausmessen</button>':''}
    <button class="btn" id="vclose" style="flex:1">Fertig</button></div>`;
  document.body.appendChild(v);
  const close=async ()=>{ p.caption=$('#cap',v).value; await put('photos',p); v.remove(); onChange&&onChange(); };
  $('#vclose',v).onclick=close;
  $('#vdel',v).onclick=async ()=>{ if(confirm('Foto löschen?')){ await del('photos',p.id); v.remove(); onChange&&onChange(); } };
  const m=$('#vmess',v); if (m) m.onclick=async ()=>{ await close(); openMeasure(p, messCtx, onChange); };
}

   Angebot: Leistungsliste aus dem Aufmaß
   ========================================================= */
// Leistungen einer Fläche: Vorarbeiten, Tapete, Anstrich – jeweils mit der Flächenmenge
function flaechenLeistungen(titel, f, menge){
  if (!f) return [];
  const out = [];
  for (const v of f.vor||[]) out.push([`${titel}: ${v}`, menge, 'm²', titel, v, 0]);
  if (f.belag) out.push([`${titel} tapezieren: ${f.belag}`, menge, 'm²', titel, `Tapezieren: ${f.belag}`, 1]);
  if (f.anstrich) out.push([`${titel} streichen ${f.anzahl||2}×: ${f.anstrich}${f.farbton?`, Farbton ${f.farbton}`:''}`, menge, 'm²', titel,
    `Streichen ${f.anzahl||2}× ${f.anstrich.replace('Brillux ','')}${f.farbton?` · ${f.farbton}`:''}`, 2]);
  return out;
}
// Mengen für sonstige Arbeiten
function mengeFuer(arbeit, r){
  const treffer = re => migrateRoom(r).pos.filter(x=>re.test(x.label||''));
  const pos = (re, art) => { const t = treffer(re).filter(x=>!art || x.art===art);
    return t.length ? [t.reduce((s,x)=>s+posMenge(x),0), POS_UNITS[t[0].art]] : null; };
  const tueren = (r.abzuege||[]).filter(a=>/tür/i.test(a.art)).reduce((s,a)=>s+(num(a.n)??1),0);
  const fenster = (r.abzuege||[]).filter(a=>/Fenster/.test(a.art)).reduce((s,a)=>s+(num(a.n)??1),0);
  const c = calc(r);
  switch (arbeit){
    case 'Abdecken / Abkleben': return r.typ==='fassade' ? [null,'psch'] : [c.boden, 'm²'];
    case 'Türen lackieren': return pos(/tür/i,'stk') || [tueren||null, 'Stk'];
    case 'Zargen lackieren': return pos(/zarge/i,'stk') || pos(/tür/i,'stk') || [tueren||null, 'Stk'];
    case 'Fenster lackieren': return pos(/fenster(?!bank)/i,'stk') || [fenster||null, 'Stk'];
    case 'Heizkörper lackieren': return pos(/heizk/i,'stk') || pos(/heizk/i) || [null,'Stk'];
    case 'Sockelleisten': return pos(/sockel/i) || [null,'lfm'];
    case 'Fensterbänke streichen': return pos(/fensterbank/i) || [null,'lfm'];
    case 'Dachuntersicht streichen': return pos(/dachunter/i) || [null,'m²'];
    case 'Ortgang/Dachkasten streichen': return pos(/ortgang|dachkasten/i) || [null,'lfm'];
    case 'Fensterläden lackieren': return pos(/läden|laden/i) || [null,'Stk'];
    case 'Fallrohre lackieren': return pos(/fallrohr|rohr/i) || [null,'lfm'];
    case 'Gerüst': return pos(/gerüst/i) || [null,'m²'];
    default: return [null, 'psch'];
  }
}
async function leistungen(id){
  const rooms=sortiert(await byIdx('rooms','projectId',id));
  const map = new Map();
  const add = (arbeit, menge, einheit, name, gruppe='Sonstiges', kurz=arbeit, art=3) => {
    const key = arbeit+'|'+einheit;
    const e = map.get(key) || {arbeit, einheit, menge:0, raeume:[], gruppe, kurz, art};
    if (menge) e.menge += menge;
    e.raeume.push({name, menge});
    map.set(key, e);
  };
  for (const r of rooms){
    const c = calc(r), name = r.name || (r.typ==='fassade'?'Fassade':'Raum');
    for (const [k,t] of flaechenVon(r))
      for (const [a,m,u,g,kz,art] of flaechenLeistungen(t, r.flaechen[k], c.fl[k])) add(a, m, u, name, g, kz, art);
    for (const a of r.arbeiten||[]){ const [m,u] = mengeFuer(a, r); add(a, m, u, name); }
  }
  const G = ['Decke','Wände','Fassade','Sockel','Sonstiges'];
  const liste = [...map.values()].map((e,i)=>({...e, i})).sort((a,b)=>(G.indexOf(a.gruppe)-G.indexOf(b.gruppe)) || (a.art-b.art) || (a.i-b.i));
  return {rooms, liste};
}

    <button class="btn sec block" id="copy">Text kopieren</button>
    <p class="muted" style="font-size:14px">„An Claude senden“ öffnet das Teilen-Menü. Dort die <b>Claude-App</b> auswählen. Claude schreibt daraus das Angebot mit deinem Briefkopf als PDF.</p>`;
  $('#hinweis').oninput = debounce(async e=>{ p.angebotHinweis=e.target.value; await put('projects', p); }, 300);
  const text = async () => {
    p.angebotHinweis = $('#hinweis').value; await put('projects', p);
    return angebotText(p, rooms, liste) + '\n\n' + await projectText(id);
  };
  $('#send').onclick = async ()=> shareText(await text());
  $('#copy').onclick = async ()=>{ const t=await text();
    try{ await navigator.clipboard.writeText(t); toast('Kopiert – jetzt in Claude einfügen'); }catch{ prompt('Text kopieren:', t); } };
}
function angebotText(p, rooms, liste){
  let t = `Bitte erstelle ein Angebot für meinen Malerbetrieb.\n\n`;
  t += `KUNDE: ${p.kunde||''}\n${p.adresse?`ADRESSE: ${p.adresse}\n`:''}${p.telefon?`TELEFON: ${p.telefon}\n`:''}AUFMASS VOM: ${fmtDate(p.datum)}\n\n`;
  t += `MATERIAL: ausschließlich Brillux. Raufaser mit Brillux Intromatt oder Raulan, glatte Flächen (Lightvlies 130) mit Brillux Superlux, Fassade mit Brillux Silicon-Fassadenfarbe.\n\n`;
  t += `LEISTUNGEN (Mengen aus dem Aufmaß, Flächen nach VOB):\n`;
  liste.forEach((e,i)=>{
    t += `${i+1}. ${e.arbeit}: ${fmtE(e.menge,e.einheit)}`;
    t += ` (${e.raeume.map(x=>x.name+(x.menge?` ${e.einheit==='Stk'?fmt(x.menge,0):fmt(x.menge)}`:'')).join(', ')})\n`;
  });
  const extra = posSumme(rooms);
  if (extra.length) t += `\nWEITERE GEMESSENE POSITIONEN:\n` + extra.map(e=>`- ${e.label}: ${e.art==='stk'?fmt(e.menge,0):fmt(e.menge)} ${POS_UNITS[e.art]}`).join('\n') + '\n';
  if (p.angebotHinweis) t += `\nHINWEISE: ${p.angebotHinweis}\n`;
  t += `\n--- Aufmaß im Detail ---`;
  return t;
}

async function projectText(id){
  const p=await get('projects',id);
  const rooms=sortiert(await byIdx('rooms','projectId',id));
  let t=`AUFMASS ${p.kunde||''}\n${p.adresse||''}\nDatum: ${fmtDate(p.datum)}\n${p.notiz?p.notiz+'\n':''}\n`;
  let sW=0,sD=0,sF=0,sS=0;
  for (const r of rooms){
    const c=calc(r);
    if (r.typ==='fassade'){
      sF+=c.fassade||0; sS+=c.sockel||0;
      t+=`— Fassade: ${r.name||'Seite'} —\n`;
      t+=`B ${r.b} × H ${r.h} m = ${fmt(c.rechteck)} m²`;
      if (c.giebel) t+=` + Giebel ${fmt(c.giebel)} m² (B ${r.gb||r.b} × H ${r.gh} m ÷ 2)`;
      t+='\n';
      if (c.sockel) t+=`Sockel: Höhe ${r.sockelH} m = ${fmt(c.sockel)} m²\n`;
    } else {
      sW+=c.wand||0; sD+=c.decke||0;
      t+=`— ${r.name||'Raum'} —\n`;
      if (r.form==='walls') t+=`Wände: ${(r.walls||[]).map(w=>w.len).join(' + ')} m, Höhe ${r.h} m\n`;
      else t+=`L ${r.l} × B ${r.b} m, Höhe ${r.h} m\n`;
    }
    for (const a of r.abzuege||[]){ const o=oeffnung(a);
      t+=`${a.art} ${a.n||1}× ${a.b} × ${a.h} m: ${!o?'':!o.abziehen?'übermessen':`abgezogen −${fmt(o.gesamt)} m²${o.leibung?`, Leibung +${fmt(o.leibung)} m² (Tiefe ${a.t} m, ${o.seiten} Seiten)`:''}`}\n`; }
    for (const f of r.fotoFlaechen||[]) t+=`${f.label||'Fläche'} (aus Foto): ${f.typ==='minus'?'−':'+'}${f.m2} m²\n`;
    for (const x of r.pos) t+=`${x.label||'Position'}: ${fmtMenge(x)} ${POS_UNITS[x.art]}${x.art==='lfm'&&(x.werte||[]).filter(Boolean).length>1?` (${x.werte.filter(Boolean).join(' + ')})`:''}\n`;
    if (r.typ==='fassade') t+=`Fassadenfläche (VOB): ${fmt(c.fassade)} m²${c.sockel?` | Sockel: ${fmt(c.sockel)} m²`:''}\n`;
    else t+=`Wandfläche (VOB): ${fmt(c.wand)} m² | Decke: ${fmt(c.decke)} m² | Umfang: ${fmt(c.umfang)} m\n`;
    for (const [k,tt] of flaechenVon(r)){ const s=flaecheText(r.flaechen[k]); if (s) t+=`${tt}: ${s}\n`; }
    if ((r.arbeiten||[]).length) t+=`Sonstiges: ${r.arbeiten.join(', ')}\n`;
    if (r.notiz) t+=`Notiz: ${r.notiz}\n`;
    t+='\n';
  }
  if (sW||sD) t+=`SUMME Wände: ${fmt(sW)} m² | Decken: ${fmt(sD)} m²\n`;
  if (sF||sS) t+=`SUMME Fassade: ${fmt(sF)} m² | Sockel: ${fmt(sS)} m²\n`;
  for (const e of posSumme(rooms)) t+=`SUMME ${e.label}: ${e.art==='stk'?fmt(e.menge,0):fmt(e.menge)} ${POS_UNITS[e.art]}\n`;
  return t;
}
async function shareText(text){
  if (navigator.share){ try{ await navigator.share({text}); return; }catch(e){ if(e.name==='AbortError') return; } }
  try{ await navigator.clipboard.writeText(text); toast('In Zwischenablage kopiert'); }
  catch{ prompt('Text kopieren:', text); }
}

/* =========================================================
   Foto ausmessen mit Referenzmaß
   (z. B. Fassadenbreite mit DISTO messen → im Foto als Referenz
   markieren → Giebelhöhe, Flächen usw. im Foto abgreifen)
   ========================================================= */
function openMeasure(photo, ctx, onChange){
  const ov = document.createElement('div'); ov.className = 'mov';
  ov.innerHTML = `
    <div class="mtop"><button class="btn sec small" id="mx">Abbrechen</button>
      <div id="mhint" class="mhint"></div>
      <button class="btn small" id="mok">Speichern</button></div>
    <div class="mstage" id="mstage"><canvas id="mc"></canvas><canvas id="mloupe" width="300" height="300" hidden></canvas></div>
    <div class="mbar">
      <div class="seg" id="mtools" style="margin-bottom:8px">
        <button data-t="ref">① Referenz</button><button data-t="line">Strecke</button><button data-t="area">Fläche</button></div>
      <div class="row" style="align-items:flex-end">
        <label class="f measure" style="margin:0"><span>Referenzmaß (echte Länge)</span>
          <input id="mref" data-solo inputmode="decimal" autocomplete="off" placeholder="z. B. 8,50"><span class="unit">m</span></label>
        <button class="btn sec small" id="mundo" style="flex:none;margin-bottom:2px">↶</button>
        <button class="btn small" id="mclose" style="flex:none;margin-bottom:2px" hidden>Fläche schließen</button>
      </div>
      <div id="mlist" style="margin-top:8px"></div>
    </div>`;
  document.body.appendChild(ov);
  document.body.style.overflow = 'hidden';

  const stage = $('#mstage', ov), cv = $('#mc', ov), cx = cv.getContext('2d');
  const loupe = $('#mloupe', ov), lx = loupe.getContext('2d');
  const refIn = $('#mref', ov);
  const M = JSON.parse(JSON.stringify(photo.messung || {ref:null, refLen:'', items:[]}));
  refIn.value = M.refLen || '';
  let tool = M.ref ? 'line' : 'ref', cur = [];
  let W=0, H=0, dpr=1, scale=1, ox=0, oy=0, fitScale=1;
  const img = new Image();

  const pxPerM = () => { const L = num(refIn.value); return (M.ref && L) ? dist(M.ref[0], M.ref[1]) / L : null; };
  const dist = (a,b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
  const areaPx = pts => Math.abs(pts.reduce((s,p,i)=>{ const q=pts[(i+1)%pts.length]; return s + p[0]*q[1] - q[0]*p[1]; },0))/2;
  const toScreen = p => [p[0]*scale+ox, p[1]*scale+oy];
  const toImage  = (x,y) => [(x-ox)/scale, (y-oy)/scale];
  const valueOf = it => { const k = pxPerM(); if (!k) return null;
    return it.t==='line' ? dist(it.pts[0], it.pts[1])/k : areaPx(it.pts)/(k*k); };

  function resize(){
    const r = stage.getBoundingClientRect(); dpr = window.devicePixelRatio || 1;
    W = r.width; H = r.height; cv.width = W*dpr; cv.height = H*dpr;
    cv.style.width = W+'px'; cv.style.height = H+'px';
  }
  function fit(){
    fitScale = scale = Math.min(W/img.naturalWidth, H/img.naturalHeight);
    ox = (W - img.naturalWidth*scale)/2; oy = (H - img.naturalHeight*scale)/2;
  }

  // Zeichnen (für Bildschirm und für das gespeicherte Bild)
  function drawOverlay(g, tf, lw, fs){
    const line = (a,b,col,dash) => { g.save(); g.strokeStyle=col; g.lineWidth=lw; if(dash) g.setLineDash([lw*3,lw*2]);
      g.beginPath(); g.moveTo(...tf(a)); g.lineTo(...tf(b)); g.stroke(); g.restore(); };
    const dot = (p,col) => { const s=tf(p); g.beginPath(); g.arc(s[0],s[1],lw*2.2,0,7); g.fillStyle='#fff'; g.fill();
      g.lineWidth=lw*0.8; g.strokeStyle=col; g.stroke(); };
    const label = (p, txt, col) => { const s=tf(p); g.font=`700 ${fs}px -apple-system,Segoe UI,sans-serif`;
      const w=g.measureText(txt).width+fs*0.8, h=fs*1.5; g.fillStyle=col; g.beginPath();
      g.roundRect ? g.roundRect(s[0]-w/2, s[1]-h-fs*0.4, w, h, fs*0.3) : g.rect(s[0]-w/2, s[1]-h-fs*0.4, w, h); g.fill();
      g.fillStyle = col==='#ffd60a' ? '#000' : '#fff'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(txt, s[0], s[1]-h/2-fs*0.4); };
    const mid = (a,b) => [(a[0]+b[0])/2, (a[1]+b[1])/2];
    const k = pxPerM();
    M.items.forEach((it,i)=>{
      const v = valueOf(it), nr = `${i+1}`;
      if (it.t==='line'){ line(it.pts[0], it.pts[1], '#e5243b'); it.pts.forEach(p=>dot(p,'#e5243b'));
        label(mid(it.pts[0], it.pts[1]), `${nr}: ${v!=null?fmt(v)+' m':'?'}`, '#e5243b'); }
      else { g.save(); g.beginPath(); it.pts.forEach((p,j)=>{ const s=tf(p); j?g.lineTo(...s):g.moveTo(...s); }); g.closePath();
        g.fillStyle='rgba(229,36,59,.25)'; g.fill(); g.lineWidth=lw; g.strokeStyle='#e5243b'; g.stroke(); g.restore();
        it.pts.forEach(p=>dot(p,'#e5243b'));
        const c=[it.pts.reduce((s,p)=>s+p[0],0)/it.pts.length, it.pts.reduce((s,p)=>s+p[1],0)/it.pts.length];
        label(c, `${nr}: ${v!=null?fmt(v)+' m²':'?'}`, '#e5243b'); }
    });
    if (M.ref){ line(M.ref[0], M.ref[1], '#ffd60a'); M.ref.forEach(p=>dot(p,'#d4a800'));
      label(mid(M.ref[0], M.ref[1]), `Referenz ${k?fmt(num(refIn.value))+' m':'?'}`, '#ffd60a'); }
    if (cur.length){
      for (let i=1;i<cur.length;i++) line(cur[i-1], cur[i], tool==='ref'?'#ffd60a':'#4da3ff', true);
      cur.forEach(p=>dot(p, '#4da3ff'));
    }
  }
  function draw(){
    cx.setTransform(dpr,0,0,dpr,0,0); cx.clearRect(0,0,W,H);
    cx.fillStyle='#111'; cx.fillRect(0,0,W,H);
    if (img.complete) cx.drawImage(img, ox, oy, img.naturalWidth*scale, img.naturalHeight*scale);
    drawOverlay(cx, toScreen, 2.5, 13);
  }
  function drawLoupe(p, sx, sy){
    loupe.hidden = false;
    const z = Math.max(scale*3, fitScale*4), S = 300, half = S/(2*z);
    lx.setTransform(1,0,0,1,0,0); lx.clearRect(0,0,S,S); lx.fillStyle='#111'; lx.fillRect(0,0,S,S);
    lx.drawImage(img, p[0]-half, p[1]-half, half*2, half*2, 0, 0, S, S);
    const tf = q => [(q[0]-p[0]+half)*z, (q[1]-p[1]+half)*z];
    drawOverlay(lx, tf, 3, 18);
    lx.strokeStyle='#fff'; lx.lineWidth=2; lx.beginPath(); lx.moveTo(S/2-25,S/2); lx.lineTo(S/2+25,S/2); lx.moveTo(S/2,S/2-25); lx.lineTo(S/2,S/2+25); lx.stroke();
    loupe.style.left = (sx < W/2 ? W-160 : 10) + 'px';
  }

  function hint(){
    const h = $('#mhint', ov);
    if (tool==='ref') h.textContent = M.ref && !cur.length ? 'Referenz gesetzt. Maß unten eintragen oder neu antippen.' :
      'Anfang und Ende einer bekannten Länge antippen (z. B. Fassadenbreite, mit DISTO gemessen).';
    else if (!pxPerM()) h.textContent = 'Zuerst ① Referenz setzen und echtes Maß eintragen.';
    else if (tool==='line') h.textContent = 'Anfang und Ende der Strecke antippen.';
    else h.textContent = cur.length>=3 ? 'Weitere Ecken antippen oder „Fläche schließen“.' : 'Ecken der Fläche nacheinander antippen.';
    $$('#mtools button', ov).forEach(b=>b.classList.toggle('on', b.dataset.t===tool));
    $('#mclose', ov).hidden = !(tool==='area' && cur.length>=3);
  }

  function list(){
    const fields = ctx.fields();
    $('#mlist', ov).innerHTML = M.items.length ? M.items.map((it,i)=>{
      const v = valueOf(it);
      return `<div class="sub" style="margin-bottom:8px">
        <div class="head"><b style="flex:none">${i+1}</b>
          <input data-ml="${i}" value="${esc(it.label||'')}" placeholder="${it.t==='line'?'z. B. Giebelhöhe':'z. B. Giebelfläche'}">
          <b style="flex:none;white-space:nowrap">${v!=null ? fmt(v)+(it.t==='line'?' m':' m²') : '–'}</b>
          <button class="x" data-mdel="${i}">✕</button></div>
        ${v==null ? '' : it.t==='line'
          ? `<select data-mset="${i}"><option value="">→ In Feld übernehmen …</option>${fields.map(f=>`<option value="${esc(f.key)}">${esc(f.label)}</option>`).join('')}</select>`
          : `<div class="actions"><button class="btn sec small" data-madd="${i}|plus">+ zur Fläche</button>
             <button class="btn sec small" data-madd="${i}|minus">− abziehen</button></div>`}
      </div>`; }).join('')
      : '<p class="muted" style="font-size:13px;margin:0">Noch keine Messungen. Tipp: Foto möglichst gerade von vorne aufnehmen – die Referenz muss in derselben Ebene liegen wie das, was du misst.</p>';
    $$('[data-ml]', ov).forEach(s=>s.oninput=()=>{ M.items[+s.dataset.ml].label = s.value; });
    $$('[data-mdel]', ov).forEach(b=>b.onclick=()=>{ M.items.splice(+b.dataset.mdel,1); list(); draw(); });
    $$('[data-mset]', ov).forEach(s=>s.onchange=()=>{
      if (!s.value) return; const it=M.items[+s.dataset.mset];
      ctx.setLength(s.value, valueOf(it)); toast(`${fmt(valueOf(it))} m übernommen`);
      it.label ||= s.options[s.selectedIndex].text; list();
    });
    $$('[data-madd]', ov).forEach(b=>b.onclick=()=>{
      const [i,typ]=b.dataset.madd.split('|'), it=M.items[+i];
      if (!(valueOf(it) > 0)){ toast('Fläche ist 0 – Ecken prüfen'); return; }
      ctx.addArea(it.label || `Fläche ${+i+1} aus Foto`, valueOf(it), typ);
      toast(typ==='minus' ? 'Als Abzug übernommen' : 'Zur Fläche addiert'); b.disabled = true;
    });
  }
  const update = () => { draw(); hint(); list(); };

  function addPoint(p){
    cur.push(p);
    if (tool==='ref' && cur.length===2){ M.ref = cur; cur = []; if (!num(refIn.value)) refIn.focus(); tool = 'line'; if (!num(refIn.value)) tool='ref'; }
    else if (tool==='line' && cur.length===2){ M.items.push({t:'line', pts:cur, label:''}); cur = []; }
    update();
  }

  // Touch: Tippen = Punkt, Punkt ziehen = verschieben (mit Lupe), 1 Finger ziehen = Bild verschieben, 2 Finger = Zoom
  const ptrs = new Map(); let drag=null, pan=null, pinch=null, moved=false;
  const allPts = () => [...(M.ref||[]), ...M.items.flatMap(i=>i.pts), ...cur];
  const pos = e => { const r=stage.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; };
  cv.addEventListener('pointerdown', e=>{
    cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, pos(e)); moved=false;
    if (ptrs.size===2){
      drag=null; pan=null; const [a,b]=[...ptrs.values()];
      pinch={d:dist(a,b), c:[(a[0]+b[0])/2,(a[1]+b[1])/2], s:scale, ox, oy}; return;
    }
    const s = pos(e);
    drag = allPts().find(p=>dist(toScreen(p), s) < 26) || null;
    pan = drag ? null : {s, ox, oy};
  });
  cv.addEventListener('pointermove', e=>{
    if (!ptrs.has(e.pointerId)) return;
    ptrs.set(e.pointerId, pos(e));
    if (pinch && ptrs.size===2){
      const [a,b]=[...ptrs.values()], d=dist(a,b), c=[(a[0]+b[0])/2,(a[1]+b[1])/2];
      const ns = Math.min(fitScale*15, Math.max(fitScale*0.5, pinch.s*d/pinch.d));
      const ix=(pinch.c[0]-pinch.ox)/pinch.s, iy=(pinch.c[1]-pinch.oy)/pinch.s;
      scale=ns; ox=c[0]-ix*ns; oy=c[1]-iy*ns; moved=true; draw(); return;
    }
    const s = pos(e);
    if (drag){ const ip = toImage(...s); drag[0]=ip[0]; drag[1]=ip[1]; moved=true; draw(); drawLoupe(drag, s[0], s[1]); return; }
    if (pan && dist(s, pan.s) > 8){ moved=true; ox = pan.ox + s[0]-pan.s[0]; oy = pan.oy + s[1]-pan.s[1]; draw(); }
  });
  const up = e=>{
    if (!ptrs.has(e.pointerId)) return;
    const s = pos(e); ptrs.delete(e.pointerId);
    if (pinch){ if (ptrs.size===0) pinch=null; return; }
    loupe.hidden = true;
    if (drag){ const d=drag; drag=null; if (!moved) addPoint([d[0], d[1]]); else update(); pan=null; return; }
    if (!moved && e.type==='pointerup') addPoint(toImage(...s));
    pan=null;
  };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  stage.addEventListener('wheel', e=>{ e.preventDefault(); const s=pos(e), f=e.deltaY<0?1.15:1/1.15;
    const ns=Math.min(fitScale*15, Math.max(fitScale*0.5, scale*f)); ox=s[0]-(s[0]-ox)*ns/scale; oy=s[1]-(s[1]-oy)*ns/scale; scale=ns; draw(); }, {passive:false});

  $$('#mtools button', ov).forEach(b=>b.onclick=()=>{ tool=b.dataset.t; cur=[]; update(); });
  $('#mundo', ov).onclick = ()=>{ if (cur.length) cur.pop(); else if (M.items.length) M.items.pop(); else M.ref=null; update(); };
  $('#mclose', ov).onclick = ()=>{ if (cur.length<3) return; M.items.push({t:'area', pts:cur, label:''}); cur=[]; update(); };
  refIn.addEventListener('input', ()=>{
    M.refLen = refIn.value;
    if (tool==='ref' && M.ref && num(refIn.value) && !cur.length) tool = 'line';
    update();
  });
  refIn.addEventListener('blur', ()=>{ const n=num(refIn.value); if (n!=null){ refIn.value = fmtM(n); M.refLen = refIn.value; }
    if (tool==='ref' && M.ref && n) { tool='line'; update(); } });
  // DISTO: Referenzmaß direkt messen
  const alteZiel = Disto.target;
  if (Disto.connected) Disto.setTarget(refIn);
  refIn.addEventListener('focus', ()=>{ if (Disto.connected){ Disto.setTarget(refIn); refIn.blur(); } });

  const schliessen = () => { document.body.style.overflow=''; Disto.setTarget(null); Disto.target = null; ov.remove(); window.removeEventListener('resize', onResize); };
  $('#mx', ov).onclick = ()=>{ schliessen(); ctx.done(); };
  $('#mok', ov).onclick = async ()=>{
    M.refLen = refIn.value;
    photo.messung = M;
    // Bild mit eingezeichneten Maßen speichern (für Bericht und Vorschau)
    if (M.ref || M.items.length){
      const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
      const g = c.getContext('2d'); g.drawImage(img, 0, 0);
      const base = Math.max(c.width, c.height);
      drawOverlay(g, p=>p, Math.max(2, base/400), Math.max(14, base/45));
      photo.annot = await new Promise(r=>c.toBlob(r, 'image/jpeg', 0.85));
    } else delete photo.annot;
    await put('photos', photo);
    schliessen(); toast('Messung gespeichert');
    ctx.done(); onChange && onChange();
  };
  const onResize = () => { resize(); fit(); draw(); };
  window.addEventListener('resize', onResize);
  img.onload = () => { resize(); fit(); update(); };
  img.src = URL.createObjectURL(photo.blob);
}

   Datensicherung
   ========================================================= */
function viewData(){
  setHeader('Daten & Sicherung', {back:true});
  app.innerHTML = `
    <div class="card">
      <h2>Sicherung</h2>
      <p style="margin-top:0">Alle Daten liegen <b>nur auf diesem iPhone</b>. Mach ab und zu eine Sicherung (z. B. in iCloud Drive oder per Mail an dich).</p>
      <button class="btn block" id="exp" style="margin-bottom:10px">Sicherung erstellen</button>
      <label class="btn sec block"><input type="file" accept=".json,application/json" id="imp" hidden>Sicherung einspielen</label>
      <p class="muted" id="usage" style="font-size:14px;margin-bottom:0"></p>
    </div>
    <div class="card"><h2>Hilfe</h2><a href="#/hilfe">Leica DISTO verbinden & benutzen</a></div>`;
  if (navigator.storage?.estimate) navigator.storage.estimate().then(e=>{
    $('#usage').textContent=`Belegter Speicher: ${(e.usage/1048576).toFixed(1)} MB`;
  });
  $('#exp').onclick = exportAll;
  $('#imp').onchange = e => importAll(e.target.files[0]);
}
const blobToB64 = b => new Promise(r=>{ const f=new FileReader(); f.onload=()=>r(f.result); f.readAsDataURL(b); });
async function exportAll(){
  toast('Sicherung wird erstellt …');
  const photos = await Promise.all((await all('photos')).map(async p=>({...p, blob: await blobToB64(p.blob), annot: p.annot ? await blobToB64(p.annot) : undefined})));
  const data = {app:'aufmass', version:1, exported:new Date().toISOString(),
    projects: await all('projects'), rooms: await all('rooms'), photos};
  const file = new File([JSON.stringify(data)], `Aufmass-Sicherung-${new Date().toISOString().slice(0,10)}.json`, {type:'application/json'});
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:'Aufmaß-Sicherung'}); return; }catch(e){ if(e.name==='AbortError') return; }
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=file.name; a.click();
}
async function importAll(file){
  if(!file) return;
  try{
    const data = JSON.parse(await file.text());
    if (data.app!=='aufmass') throw new Error('Keine Aufmaß-Sicherung');
    if (!confirm(`${data.projects.length} Baustellen einspielen? Vorhandene Einträge mit gleicher ID werden überschrieben.`)) return;
    for (const p of data.projects) await put('projects', p);
    for (const r of data.rooms) await put('rooms', r);
    for (const ph of data.photos){ ph.blob = await (await fetch(ph.blob)).blob(); if (ph.annot) ph.annot = await (await fetch(ph.annot)).blob(); await put('photos', ph); }
    toast('Sicherung eingespielt'); location.hash='#/';
  }catch(e){ alert('Fehler beim Einspielen: '+e.message); }
}

        <li>DISTO einschalten, Bluetooth-Zeichen muss im Display zu sehen sein.</li>
        <li>Unten links auf <b>„DISTO verbinden“</b> tippen und den DISTO in der Liste auswählen.</li>
        <li>Im Testfeld unten messen.</li>
      </ol>
    </div>` : `
    <div class="card">
      <h2>Direkte Übertragung vom DISTO D510</h2>
      <p style="margin-top:0">Safari kann leider nicht direkt mit dem DISTO sprechen. Dafür gibt es den kostenlosen Browser <b>„Bluefy – Web BLE Browser“</b>:</p>
      <ol style="padding-left:20px;margin:0">
        <li><b>App Store</b> öffnen, nach <b>„Bluefy“</b> suchen und laden.</li>
        <li>Bluefy öffnen und diese Adresse eingeben:<br><b style="word-break:break-all">${esc(url)}</b>
          <button class="btn sec small" id="copyUrl" style="margin-top:6px">Adresse kopieren</button></li>
        <li>Bluetooth-Zugriff erlauben.</li>
        <li>Wichtig: <b>DISTO Plan schließen</b> und den DISTO <b>nicht</b> in den iPhone-Einstellungen koppeln.</li>
        <li>In Bluefy: Hilfe-Seite → „DISTO verbinden“.</li>
      </ol>
      <p class="muted" style="font-size:14px;margin-bottom:0">Die Daten liegen pro Browser getrennt. Nimm am besten für die Arbeit immer Bluefy.</p>
    </div>`}
    <div class="card">
      <h2>So wird gemessen</h2>
      <ol style="padding-left:20px;margin:0">
        <li>Maß-Feld antippen → es wird rot markiert („◀ DISTO“).</li>
        <li>Am DISTO die DIST-Taste drücken.</li>
        <li>Der Wert landet im Feld, die Markierung springt zum nächsten Feld: Länge → Breite → Höhe → Abzüge …</li>
      </ol>
    </div>
    <div class="card">
      <h2>Testfeld</h2>
      <label class="f measure"><span>Antippen und am DISTO messen</span>
        <input id="test" data-measure data-key="test" inputmode="decimal" autocomplete="off" placeholder="0,000"><span class="unit">m</span></label>
      <div id="testlog" class="muted" style="font-size:13px;font-family:ui-monospace,monospace;white-space:pre-wrap"></div>
    </div>
    <div class="card">
      <h2>Klappt es nicht?</h2>
      <p style="margin:0">Einfach die Zahl vom Display ins Feld tippen. Komma oder Punkt ist egal. Die App rechnet trotzdem alles aus.</p>
    </div>`;
  const t=$('#test'), log=$('#testlog'); const lines=[];
  const addLog = s => { lines.unshift(s); log.textContent = lines.slice(0,8).join('\n'); };
  t.addEventListener('focus', ()=>{ if (Disto.connected){ Disto.setTarget(t); t.blur(); } });
  t.addEventListener('input', ()=>{ const n=num(t.value); if(n!=null) addLog(`✅ Wert: ${fmtM(n)} m`); });
  t.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); t.blur(); } });
  Disto.onRaw = (uuid, hex, m) => { addLog(`${uuid.slice(0,8)}: ${hex}${m!=null?`  → ${fmtM(m)} m`:''}`); if (m!=null) setTimeout(()=>Disto.setTarget(t),50); };
  updateMeasureInputs();
  if (Disto.connected) Disto.setTarget(t);
  const cu=$('#copyUrl'); if (cu) cu.onclick=async()=>{ try{ await navigator.clipboard.writeText(url); toast('Adresse kopiert'); }catch{ prompt('Adresse:', url); } };
}
