name: Build Canon Scanner EXE

on:
  push:
    branches:
      - "**"
    paths:
      - "canon-scanner-pdf/**"
      - ".github/workflows/build-canon-scanner-exe.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r canon-scanner-pdf/requirements.txt
          pip install pyinstaller

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name ScanToPDF canon-scanner-pdf/scan_to_pdf.py --distpath canon-scanner-pdf/dist

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScanToPDF-exe
          path: canon-scanner-pdf/dist/ScanToPDF.exe

      - name: Publish as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: scanner-v${{ github.run_number }}
          name: ScanToPDF v${{ github.run_number }}
          files: canon-scanner-pdf/dist/ScanToPDF.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
